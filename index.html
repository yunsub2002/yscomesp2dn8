<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kickoff"><meta name="theme-color" content="#0a1f16">
<title>Kickoff Manager 26/27 FM2027 v6</title><style>:root{
 --bg:#0d1512;--panel:#14211c;--panel2:#1a2b25;--line:#24392f;--tx:#e6efe9;--mut:#8ea79a;
 --acc:#3ddc84;--acc2:#2bb673;--warn:#f5b942;--bad:#ef5350;--blue:#4aa3ff;--gold:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--panel2);color:var(--tx);font-weight:600;font-size:13px;transition:.15s}
button:hover{filter:brightness(1.2)}
button.pri{background:var(--acc2);color:#05140c}
button.pri:hover{background:var(--acc)}
button.ghost{background:transparent;border:1px solid var(--line)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
select,input{font-family:inherit;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:60px 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;background:linear-gradient(90deg,#0a1f16,#123526);border-bottom:1px solid var(--line)}
.top .logo{font-weight:900;letter-spacing:.5px;font-size:17px;color:var(--acc)}
.top .club{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.top .sp{flex:1}
.top .chip{background:rgba(255,255,255,.06);padding:6px 12px;border-radius:20px;font-size:12.5px;color:var(--mut)}
.top .chip b{color:var(--tx)}
.nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.nav button{text-align:left;background:transparent;padding:11px 14px;font-size:14px;color:var(--mut)}
.nav button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.nav .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.main{overflow:auto;padding:20px 24px}
h2{margin:0 0 14px;font-size:20px}
h3{margin:0 0 10px;font-size:15px;color:var(--mut);font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:10px;font-weight:900;border:2px solid;flex:none}
.badge.lg{width:56px;height:56px;font-size:15px;border-width:3px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);cursor:default}
th.s{cursor:pointer}th.s:hover{color:var(--tx)}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
tr.me td{background:rgba(61,220,132,.08)}
tr.hl td{background:rgba(74,163,255,.12)}
tbody tr:hover td{background:rgba(255,255,255,.03)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{display:inline-block;min-width:30px;text-align:center;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:800}
.pos.GK{background:#a17d14;color:#fff}.pos.D{background:#1f6fb2;color:#fff}.pos.M{background:#2c9a5a;color:#fff}.pos.A{background:#c0392b;color:#fff}
.ovr{display:inline-block;min-width:30px;text-align:center;font-weight:900;border-radius:6px;padding:2px 5px}
.bar{height:7px;border-radius:4px;background:#2a3a33;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:4px}
.mut{color:var(--mut)}.good{color:var(--acc)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--panel2);color:var(--mut)}
.tag.inj{background:#5a1f1f;color:#ffb3b3}.tag.lst{background:#4a3a10;color:var(--gold)}
.news{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.news div{padding:9px 11px;background:var(--panel2);border-radius:9px;font-size:13px;line-height:1.45}
.news small{color:var(--mut);display:block;font-size:11px}
.form i{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;font-style:normal;font-size:11px;font-weight:800;margin-right:3px}
.form .W{background:#2bb673;color:#04140b}.form .D{background:#8a8f8c;color:#111}.form .L{background:#d64541;color:#fff}
/* start screen */
.start{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:50px 20px;background:radial-gradient(circle at 50% 0,#1d4a35,#0d1512 60%)}
.start h1{font-size:40px;margin:0;letter-spacing:1px}
.start h1 span{color:var(--acc)}
.start p{color:var(--mut);margin:8px 0 26px}
.clubs{display:grid;grid-template-columns:repeat(4,220px);gap:14px}
.clubc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
.clubc:hover{transform:translateY(-3px);border-color:var(--acc)}
.clubc.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.clubc .nm{font-weight:800;font-size:15px}
/* tactics */
.pitch{position:relative;background:repeating-linear-gradient(0deg,#1f6b3f 0 36px,#226f43 36px 72px);border-radius:12px;border:2px solid #3d8b5d;aspect-ratio:68/100;width:100%;max-width:440px;margin:auto;overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.35)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box{position:absolute;left:25%;width:50%;height:15%;border:2px solid rgba(255,255,255,.35)}
.slot{position:absolute;transform:translate(-50%,-50%);width:84px;text-align:center;cursor:pointer;z-index:2}
.slot .dot{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .lb{font-size:11px;background:rgba(0,0,0,.6);border-radius:5px;padding:2px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.sel .dot{box-shadow:0 0 0 4px var(--gold)}
.slot .ft{height:3px;margin:2px 10px 0;border-radius:2px;background:#333}
.slot .ft i{display:block;height:100%}
.slider{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.slider .lbl{display:flex;justify-content:space-between;font-size:13px}
.seg{display:flex;background:var(--panel2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;padding:7px 4px;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--acc2);color:#05140c}
.strength div{display:grid;grid-template-columns:50px 1fr 36px;gap:8px;align-items:center;margin-bottom:7px;font-size:12.5px}
/* match */
.mwrap{position:fixed;inset:0;background:#08100d;z-index:50;display:grid;grid-template-columns:260px 1fr 260px;grid-template-rows:auto 1fr;gap:12px;padding:12px}
.sb{grid-column:1/4;display:flex;align-items:center;justify-content:center;gap:24px;background:var(--panel);border-radius:14px;padding:12px}
.sb .tm{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;min-width:260px}
.sb .tm.r{justify-content:flex-end}
.sb .sc{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.sb .min{font-size:13px;color:var(--acc);font-weight:800;text-align:center}
.mcol{background:var(--panel);border-radius:14px;padding:12px;overflow:auto}
.mid{display:flex;flex-direction:column;gap:12px;min-height:0}
canvas{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;display:block;background:#1d6b3c}
.comm{flex:1;background:var(--panel);border-radius:14px;padding:12px;overflow:auto;min-height:120px}
.comm div{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13.5px}
.comm div b.m{display:inline-block;width:52px;color:var(--mut)}
.comm .goal{color:var(--gold);font-weight:800;font-size:15px}
.comm .card{background:none;border:0;padding:5px 0;color:var(--warn)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px}
.stat .c{text-align:center;color:var(--mut)}
.stat .dual{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#2a3a33}
.lp{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:12.5px}
.lp .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp.sel{background:rgba(255,209,102,.18);border-radius:6px}
.lp.out{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:flex;align-items:center;justify-content:center}
.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:900px;width:92%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f3a2d;border:1px solid var(--acc2);padding:11px 18px;border-radius:10px;z-index:99;font-weight:600;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.big{font-size:26px;font-weight:900}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--mut);font-size:12px}
@media (max-width:1100px){.mwrap{grid-template-columns:1fr;overflow:auto}.sb{grid-column:1}.g2,.g3{grid-template-columns:1fr}.clubs{grid-template-columns:repeat(2,1fr)}}

/* ---- v2: 드래그 전술판 ---- */
.clubs{grid-template-columns:repeat(5,190px)}
.clubc{padding:14px}
.pitch{max-width:460px;touch-action:none}
.pitch .zg{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.12);pointer-events:none}
.pitch .zl{position:absolute;right:6px;font-size:10px;color:rgba(255,255,255,.35);pointer-events:none;transform:translateY(2px)}
.tok{position:absolute;transform:translate(-50%,-50%);width:88px;text-align:center;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tok .dot{width:38px;height:38px;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.tok .lb{font-size:11px;background:rgba(0,0,0,.62);border-radius:5px;padding:2px 4px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .rl{display:inline-block;font-size:9.5px;font-weight:800;background:rgba(5,20,12,.85);color:var(--gold);border-radius:4px;padding:1px 4px;margin-top:2px}
.tok .rt{position:absolute;top:-6px;right:14px;font-size:10px;font-weight:900;background:#0b1a13;border-radius:5px;padding:0 4px;border:1px solid var(--line)}
.tok .ft{height:3px;margin:2px 14px 0;border-radius:2px;background:#333}.tok .ft i{display:block;height:100%}
.tok.empty .dot{background:rgba(0,0,0,.35)!important;border-style:dashed;border-color:#bbb;color:#ddd}
.tok.hurt .dot{background:#5a1f1f!important;border-color:#ef5350;border-style:dashed}
.tok.sel .dot{box-shadow:0 0 0 4px var(--gold)}
.tok.drag-src{opacity:.25;pointer-events:none}
.drop-hi .dot{box-shadow:0 0 0 5px var(--blue)!important}
.benchz.drop-hi{outline:2px dashed var(--blue);outline-offset:3px}
.pitch.drop-hi{box-shadow:0 0 0 3px rgba(74,163,255,.6)}
.dndghost{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px}
.dndghost .dot{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.dndghost .gl{font-size:11px;font-weight:800;background:#0b1a13;border:1px solid var(--acc2);padding:2px 7px;border-radius:6px;white-space:nowrap}
body.dragging,body.dragging *{cursor:grabbing!important}
.bcard{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);margin-bottom:5px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:12.5px}
.bcard:hover{filter:brightness(1.15)}
.bcard .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.bcard.na{opacity:.45;cursor:not-allowed}
.bcard.drag-src{opacity:.25}
.benchz{min-height:120px;max-height:640px;overflow:auto}
.tacgrid{display:grid;grid-template-columns:minmax(320px,460px) 250px minmax(300px,1fr);gap:16px;align-items:start}
.stars{color:var(--gold);letter-spacing:-1px;font-size:12px}
.attr{display:grid;grid-template-columns:62px 1fr 28px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:5px}
.mu{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:7px}
.mu .bar{height:9px}
.mubar{position:relative;height:9px;border-radius:5px;background:#2a3a33;overflow:hidden}
.mubar i{position:absolute;top:0;bottom:0}
.mubar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid rgba(255,255,255,.5)}
.tip{font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--panel2);margin-bottom:6px;line-height:1.45}
.tip.g{border-left:3px solid var(--acc)}.tip.b{border-left:3px solid var(--bad)}.tip.n{border-left:3px solid var(--blue)}
.pred{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11.5px;font-weight:800}
.pred div{display:flex;align-items:center;justify-content:center;color:#06120c}
.livebox{max-width:1180px!important}
.livegrid{display:grid;grid-template-columns:minmax(300px,420px) 230px 1fr;gap:14px;align-items:start}
.stbl td,.stbl th{padding:4px 6px;font-size:12px}
#mom{max-height:70px;background:var(--panel)}
tr.z-ucl td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
tr.z-uel td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.z-rel td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.lp .rt2{font-size:11px;font-weight:800;min-width:26px;text-align:right}
@media (max-width:1300px){.tacgrid{grid-template-columns:minmax(300px,440px) 1fr}.tacgrid>.col3{grid-column:1/3}.livegrid{grid-template-columns:1fr 1fr}.livegrid>.col3{grid-column:1/3}}
@media (max-width:1100px){.clubs{grid-template-columns:repeat(2,1fr)}.tacgrid,.livegrid{grid-template-columns:1fr}.tacgrid>.col3,.livegrid>.col3{grid-column:1}}
.pitch .pbox{position:absolute;left:25%;width:50%;height:15%;border:2px solid rgba(255,255,255,.35)}
.mid{overflow:hidden}
.mid canvas#cv{max-height:60vh;background:#174f2b}
#mom{height:46px;max-height:46px;flex:none}
.mlow{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
.mlow>*{min-height:0;overflow:auto}
.mlow .comm{min-height:0}
.livegrid{grid-template-columns:minmax(300px,420px) 260px 1fr}
.rp-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (max-width:1100px){.mlow{grid-template-columns:1fr}}

/* ---- v4: 다중 리그 · 대항전 ---- */
.lgtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.lgtabs button{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:20px;color:var(--mut)}
.lgtabs button.on{background:var(--panel2);color:var(--tx);border-color:var(--acc)}
.ctag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--mut);vertical-align:middle}
.tie{padding:8px 10px;background:var(--panel2);border-radius:9px;margin-bottom:6px;font-size:13px}
a.pl{color:var(--tx);font-weight:700;text-decoration:none}a.pl:hover{text-decoration:underline}
.gen{color:var(--mut);font-size:10px;margin-left:2px;vertical-align:super}
tr.z-uecl td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.stbl sup{line-height:0}

.modal>.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:900px;width:92%;max-height:90vh;overflow:auto}
a.cl{color:inherit;text-decoration:none;font-weight:700}a.cl:hover{color:var(--acc);text-decoration:underline}
.badge:hover{filter:brightness(1.15);box-shadow:0 0 0 2px var(--acc)}
.clubcard{cursor:pointer;transition:transform .12s,border-color .12s}.clubcard:hover{transform:translateY(-2px);border-color:var(--acc)}.clubcard.me{border-color:var(--acc)}
.stbl tr.hl td{background:rgba(61,220,132,.06)}
.modal .stbl th{white-space:nowrap}
/* ---- v6: 메일함 · 협상 ---- */
.mbadge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:900;text-align:center;margin-left:4px}
.mchips{justify-content:flex-start;margin:4px 0 12px}.mchips button{padding:6px 11px;font-size:12px}
.inbox{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:14px;align-items:start}
.mlist{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:calc(100vh - 230px);overflow:auto}
.mlist.mini{max-height:none;background:transparent;border:0}
.mi{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mi:hover{background:var(--panel2)}.mi.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--acc)}
.mi .mic{font-size:18px;flex:none}.mi .mtx{flex:1;min-width:0}.mi small{flex:none;font-size:10.5px}
.mi .mfrom{font-size:11.5px;color:var(--mut)}.mi .msub{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi.ur .msub{font-weight:800;color:var(--tx)}.mi.ur .mfrom:before{content:"● ";color:var(--acc)}
.mread{min-height:300px;max-height:calc(100vh - 230px);overflow:auto}
.mbody{margin-top:12px;line-height:1.6;font-size:13.5px}.mbody p{margin:6px 0}.mbody h3{margin-top:12px}
.negbox{background:var(--panel2);border-radius:12px;padding:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}.fld input,.fld select{width:100%}.fld small{font-size:10.5px}
.pat{display:inline-flex;gap:3px;margin-right:6px}.pat i{width:10px;height:10px;border-radius:50%;background:#2a3a33}.pat i.on{background:var(--gold)}
.steps{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.steps span{font-size:12px;padding:4px 10px;border-radius:14px;background:var(--panel2);color:var(--mut)}
.steps span.cur{background:var(--acc2);color:#05140c;font-weight:800}.steps span.ok{color:var(--acc)}
.neglog{background:var(--panel2);border-radius:10px;padding:8px 10px;max-height:160px;overflow:auto;font-size:12.5px}.neglog div{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
@media (max-width:1100px){.inbox{grid-template-columns:1fr}}
.top .chip{white-space:nowrap}.top .logo,.top .club{white-space:nowrap}@media (max-width:1400px){.top .logo{font-size:14px}}

/* ================= v7: 아이폰 세로 모드(모바일) 최적화 ================= */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.clubc,.mi,.bcard,.tok,.chip,a{-webkit-tap-highlight-color:rgba(61,220,132,.18);touch-action:manipulation}
.tw{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:760px){
 html,body{height:auto;min-height:100%;font-size:14px}
 body{overflow-x:hidden}
 body:before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#0a1f16;z-index:45;pointer-events:none}
 button{min-height:38px;padding:8px 12px}
 button.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
 select,input{font-size:16px;min-height:38px;max-width:100%}
 h2{font-size:18px;margin-bottom:10px}
 .card{padding:12px;border-radius:12px;min-width:0}
 .grid{gap:12px;min-width:0}.grid>*{min-width:0}
 .main .row,.modal .row{flex-wrap:wrap}

 /* --- 앱 골격: 사이드바 → 상단 가로 탭 --- */
 .app{display:block;height:auto;min-height:100dvh}
 .top{flex-wrap:wrap;gap:6px 8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;height:auto}
 .top .logo{width:100%;font-size:13px!important}
 .top .club{font-size:14px;flex:1 1 100%;min-width:0;overflow:hidden;text-overflow:ellipsis}
 .top .sp{display:none}
 .top .chip{font-size:11px;padding:4px 9px}
 .top>button.pri{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;padding:13px 20px;border-radius:28px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.55),0 0 0 2px rgba(61,220,132,.35)}
 .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;flex-direction:row;gap:4px;padding:6px 8px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .nav::-webkit-scrollbar{display:none}
 .nav button{flex:none;padding:8px 12px;font-size:13px;min-height:36px}
 .nav button.on{box-shadow:inset 0 -3px 0 var(--acc)}
 .nav .foot{flex-direction:row;margin-top:0;margin-left:8px;gap:4px;flex:none}
 .main{overflow:visible;padding:12px 12px calc(90px + env(safe-area-inset-bottom,0px))}

 /* --- 공통 그리드: 1열(지표 카드는 2~3열) --- */
 .g2,.g3,.grid.col3{grid-template-columns:1fr!important}
 .grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}
 .grid[style*="repeat(4,1fr)"],.grid[style*="repeat(5,1fr)"]{grid-template-columns:repeat(2,1fr)!important}
 .grid[style*="repeat(6,1fr)"],.grid[style*="repeat(3,1fr)"]{grid-template-columns:repeat(3,1fr)!important}
 .grid[style*="auto-fill"]{grid-template-columns:1fr!important}
 .big{font-size:21px}

 /* --- 표: 가로 스크롤 --- */
 th{font-size:11.5px;padding:6px 6px}
 td{padding:6px 6px;font-size:12.5px}
 .tw{margin:0 -2px}

 /* --- 시작 화면 --- */
 .start{padding:calc(24px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px))}
 .start h1{font-size:26px;text-align:center}
 .start p{text-align:center;font-size:12.5px}
 .lgtabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;padding-bottom:4px;scrollbar-width:none}
 .lgtabs::-webkit-scrollbar{display:none}
 .lgtabs button{flex:none}
 .mchips{flex-wrap:wrap}
 .clubs{grid-template-columns:repeat(2,minmax(0,1fr))!important;width:100%;gap:10px}
 .clubc{padding:12px 8px}
 .clubc:hover{transform:none}
 .start .seg{width:100%!important}
 .start .row{width:100%;justify-content:center}
 .start .row>button.pri{width:100%}

 /* --- 전술판 --- */
 .pitch{max-width:100%;touch-action:pan-y}
 .tok{width:66px}
 .tok .dot,.slot .dot{width:32px;height:32px;font-size:12px}
 .tok .lb,.slot .lb{font-size:9.5px;padding:1px 3px}
 .tok .rl{font-size:8.5px}
 .tok .rt{right:6px;font-size:9px}
 .slot{width:66px}
 .benchz{max-height:46vh}
 .bcard{touch-action:pan-y;padding:9px 8px}
 .tacgrid,.livegrid{grid-template-columns:1fr!important}
 .tacgrid>.col3,.livegrid>.col3{grid-column:1!important}

 /* --- 모달 · 토스트 --- */
 .modal{align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
 .modal>.box{width:100%!important;max-width:100%!important;max-height:92dvh;border-radius:16px 16px 0 0;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:420px;text-align:center;font-size:13px}

 /* --- 메일함 --- */
 .inbox{grid-template-columns:1fr!important}
 .mlist{max-height:38vh}
 .mread{max-height:none;min-height:0}

 /* --- 경기 화면 --- */
 .mwrap{display:flex!important;flex-direction:column;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(16px + env(safe-area-inset-bottom,0px))}
 .mwrap>*{flex:none}
 .sb{order:0;gap:8px;padding:8px;position:sticky;top:0;z-index:3}
 .sb .tm{min-width:0;flex:1;font-size:13px;gap:6px}
 .sb .tm .badge.lg{width:38px;height:38px;font-size:11px}
 .sb .sc{font-size:28px;min-width:74px}
 .mid{order:1;overflow:visible!important}
 .mid canvas#cv{max-height:none}
 .ctrl{gap:6px}
 .ctrl .seg{flex:1 1 100%}
 .mlow{grid-template-columns:1fr!important}
 .mlow>*{max-height:260px}
 .comm{min-height:200px}
 #lh{order:2}#la{order:3}
 .mcol{max-height:48vh}
}
@media (hover:none){
 button:hover{filter:none}
 .clubcard:hover,.clubc:hover{transform:none}
}

/* v8: iOS 드래그 · 페이스 */
.tok{touch-action:none!important;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bcard{touch-action:pan-y!important;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bcard .ava{pointer-events:none}
.dndghost{will-change:transform;transition:none}
.tok .dot.fc{position:relative;padding:0;overflow:visible}
.tok .dot.fc .ava{width:100%!important;height:100%!important;border-radius:50%;display:block;pointer-events:none}
.tok .dot .ov{position:absolute;right:-9px;bottom:-5px;font-size:9.5px;line-height:13px;font-weight:900;background:#0b1a13;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:0 3px}
body.dragging{overscroll-behavior:none}

// entries 기반 국면 계산 — xi: 선수 id 배열, fitMap: 경기 중 컨디션
function phasesCalc(tac,xi,fitMap,dummy){
 const sl=slotsOf(tac);const N={},S={};PH.forEach(k=>{N[k]=0;S[k]=0});
 let gk=40,n=0;
 const mA=MENT_A[tac.ment-1],mD=MENT_D[tac.ment-1];
 for(let i=0;i<11;i++){
  const id=xi[i];if(!id&&!dummy)continue;n++;
  const [lb,x,y]=sl[i];const rl=tac.roles[i];const role=ROLES[rl.r];
  const p=dummy?null:P(id);const f=dummy?100:(fitMap&&fitMap[id]!=null?fitMap[id]:p.fit);
  const mult=dummy?1:playerMult(p,lb,f);
  if(lb==='GK'){gk=dummy?75:attr(p,'gk')*mult;}
  for(const ph in role.c){
   let w=role.c[ph]*posFactor(ph,x,y);
   if(ATT_PH[ph])w*=DUTY_ATT[rl.d]*mA;else if(DEF_PH[ph])w*=DUTY_DEF[rl.d]*mD;
   if(ph==='prs')w*=[.75,1,1.3][tac.press-1];
   let v=75;if(!dummy){v=0;const pa=PH_ATTR[ph];for(const a in pa)v+=attr(p,a)*pa[a];v*=mult}
   N[ph]+=w;S[ph]+=w*v;
  }
 }
 const out={gk,n};
 PH.forEach(k=>{const q=N[k]?S[k]/N[k]:35;out[k]=dummy?N[k]:q*Math.pow(clamp(N[k]/(REF[k]||1),.35,1.8),.2)});
 if(!dummy){if(tac.roles[0].r==='SK'){out.dsp*=1.05;out.bu*=1.02}
  // 10명 이하 패널티
  if(n<11){const pen=1-(11-n)*.05;PH.forEach(k=>out[k]*=pen)}
  // 라인 사이 간격: 높은 압박 + 낮은 라인 = 중원 공간 노출
  out.gap=(tac.press===3&&tac.line===1)?1.1:(tac.press===1&&tac.line===3)?1.06:1;
 }
 return out;
}
let REF={};
(function(){const acc={};const fs=Object.keys(FORMS);fs.forEach(f=>{const t={ment:3,press:2};applyPreset(t,f);const r=phasesCalc(t,[],null,true);PH.forEach(k=>acc[k]=(acc[k]||0)+r[k]/fs.length)});REF=acc})();
function phasesOf(c){return phasesCalc(c.tac,c.tac.xi,null)}

const CAR_KEYS=['app','start','min','g','a','yc','rc','sh','sot','xg','kp','pa','pc','tk','int','dr','sv','cs','motm','rs','rn'];
function playerValue(p){
 let v=3*Math.exp((p.ovr-72)*.19);
 v*=1+Math.max(0,p.pot-p.ovr)*.05;
 v*=p.age<=23?1.2:p.age<=28?1:p.age<=30?.8:p.age<=32?.55:.3;
 if(p.inj>0)v*=.85;
 return Math.max(.3,Math.round(v*10)/10);
}
function newTac(){const t={form:'4-3-3',ment:3,press:2,tempo:2,width:2,line:2,pass:2,xi:[]};applyPreset(t,'4-3-3');return t}
// 등번호 (게임용 자동 배정 — 실제 등번호와 다를 수 있음)
const NO_PREF={GK:[1,13,31,40],CB:[4,5,6,3,15,2,12,33],LB:[3,12,21,26],RB:[2,22,24,27],DM:[6,16,4,18,25],CM:[8,16,14,18,20,23],AM:[10,8,19,17,28],LW:[11,7,17,19,29],RW:[7,11,17,19,30],ST:[9,19,14,20,99]};
function assignNumbers(){
 Object.values(G.clubs).forEach(c=>{const used=new Set();const ps=c.players.map(P).filter(p=>p.no&&!used.has(p.no)&&(used.add(p.no)||1));
  c.players.map(P).filter(p=>!p.no||!ps.includes(p)).sort((a,b)=>b.ovr-a.ovr).forEach(p=>{let n=(NO_PREF[p.pos]||[]).find(x=>!used.has(x));if(!n){n=14;while(used.has(n))n++}p.no=n;used.add(n)})});
}
function careerTot(p,clubId){const t=blankPSt();t.seasons=0;(p.car||[]).forEach(r=>{if(clubId&&r.club!==clubId)return;t.seasons++;CAR_KEYS.forEach(k=>t[k]+=r[k]||0)});
 if(p.st&&p.st.app&&(!clubId||p.club===clubId)){t.seasons++;CAR_KEYS.forEach(k=>t[k]+=p.st[k]||0)}t.xg=Math.round(t.xg*100)/100;return t}
function seasonStartSnap(p){return p.ah&&p.ah.length?p.ah[p.ah.length-1]:null}

// ================= 성장 · 노화 (FM 스타일 점진 변화) =================
// 연간 기대 변화량(OVR 포인트)을 라운드 구간마다 나눠 적용. 나이·잠재력 여유·출전시간·평점·훈련·성실성이 영향.
const club=id=>G.clubs[id];
const P=id=>G.players[id];

// ================= 선발 / 역할 =================
function effOvr(p,slot,fitOverride){
 const f=fitOverride!=null?fitOverride:p.fit;
 return p.ovr*fitOf(p.pos,slot)*(.72+.28*f/100)*(.95+.1*p.mor/100);
}
const SLOT_PRI=['GK','CB','DM','ST','CM','LB','RB','LWB','RWB','AM','LM','RM','LW','RW'];
function autoXI(c){
 const slots=slotsOf(c.tac);const used=new Set();const xi=new Array(11).fill(null);
 const pool=c.players.map(P).filter(avail);
 const order=slots.map((s,i)=>i).sort((a,b)=>SLOT_PRI.indexOf(slots[a][0])-SLOT_PRI.indexOf(slots[b][0]));
 for(const pass of [1,0])for(const i of order){if(xi[i])continue;const s=slots[i][0];
  let best=null,bv=-1;for(const p of pool){if(used.has(p.id))continue;const ft=fitOf(p.pos,s);if(pass&&ft<.99)continue;const v=p.ovr*ft*(.6+.4*p.fit/100);if(v>bv){bv=v;best=p}}
  if(best){xi[i]=best.id;used.add(best.id)}}
 c.tac.xi=xi;return xi;
}
function autoRoles(c,sty){
 sty=sty||STYLES[c.style]||STYLES.balanced;const t=c.tac;const sl=slotsOf(t);
 t.xi.forEach((id,i)=>{const lb=sl[i][0];const rs=ROLES_BY_POS[lb];if(!id){fixRole(t,i);return}const p=P(id);
  let b=rs[0],bv=-1e9;rs.forEach(r=>{const v=suit(p,r)-p.ovr+(sty.bias[r]||0)*30+(r===t.roles[i].r?.5:0);if(v>bv){bv=v;b=r}});
  const rl=t.roles[i];if(rl.r!==b){rl.r=b;rl.d=defDuty(b)}
  if(sty.ment>=4&&ROLES[b].du.includes('A')&&LINE[lb]!=='D'&&lb!=='DM')rl.d='A';
  if(sty.ment<=2&&ROLES[b].du.includes('D')&&LINE[lb]==='D')rl.d='D';
  fixRole(t,i)});
}
function teamScore(c){const s=phasesOf(c);return s.bu+s.cr+s.fin*1.3+s.wid*.7+s.dfc*1.2+s.dfw*.7+s.dae*.5+s.dsp*.5+s.gk*.8}
function styleSetup(c){
 const sty=STYLES[c.style]||STYLES.balanced;let best=sty.forms[0],bv=-1;
 sty.forms.forEach((f,k)=>{applyPreset(c.tac,f);autoXI(c);autoRoles(c,sty);const v=teamScore(c)*(1+.006*(sty.forms.length-k));if(v>bv){bv=v;best=f}});
 applyPreset(c.tac,best);autoXI(c);autoRoles(c,sty);
 ['ment','press','tempo','width','line','pass'].forEach(k=>c.tac[k]=sty[k]);
}
function validXI(c){const xi=c.tac.xi||[];if(xi.length!==11||xi.some(id=>!id||!P(id)||!avail(P(id))||P(id).club!==c.id))return false;return new Set(xi).size===11}
function teamRating(c){const sl=slotsOf(c.tac);const v=c.tac.xi.map((id,i)=>id?effOvr(P(id),sl[i][0]):45);return Math.round(v.reduce((a,b)=>a+b,0)/11)}

// ================= 상성 분석 =================
const LINEX=[.86,1,1.18];
function matchupOf(PA,tA,PD,tD){ // A 공격 vs D 수비
 const wM=[.8,1,1.3][tA.width-1],cM=[1.2,1,.85][tA.width-1];
 return [
  {k:'cen',ko:'중앙 침투',a:PA.cr,d:PD.dfc/PD.gap,w:cM*[1.15,1,.85][tA.pass-1]},
  {k:'wid',ko:'측면 공략',a:PA.wid,d:PD.dfw,w:wM},
  {k:'run',ko:'뒷공간 침투',a:PA.run,d:PD.dsp/LINEX[tD.line-1],w:[.6,1,1.5][tA.pass-1]},
  {k:'aer',ko:'공중볼 (크로스·세트피스)',a:PA.aer,d:PD.dae,w:wM*.8},
  {k:'bu',ko:'빌드업 vs 상대 압박',a:PA.bu,d:PD.prs,w:1},
  {k:'fin',ko:'결정력 vs 골키퍼',a:PA.fin,d:PD.gk,w:1}
 ].map(o=>({...o,r:o.a/o.d}));
}
function ctrlOf(Ph,t){return Ph.bu*.6+Ph.cr*.2+Ph.prs*.2+(t.pass===1?2:t.pass===3?-3:0)+(t.ment-3)*-1}

// ================= 경기 결과 현실화 모델 (v5.1) =================
// 결과 = 선수 능력치(실제 선발 11명·포지션 적합도·체력·사기) + 전술 상성(국면별 공격 vs 수비)
//      + 홈 이점 + 최근 폼(기대 대비 성과) + 상대 전적(최근 맞대결) + 경기 흐름(스코어 상황·퇴장)
const RX={base:1.31,home:1.11,away:.90,q:.038,tac:1.35,form:.05,h2h:.04,ment:.045};
// 최근 폼: 최근 6경기 (최근 경기일수록 가중) — 승점 자체(40%) + 기대 승점 대비 초과 성과(60%)
function formScore(c){const rf=(c&&c.rf)||[];if(!rf.length)return 0;let s=0,w=0;const n=rf.length;
 rf.forEach((r,i)=>{const k=Math.pow(.82,n-1-i);const pts=r.gf>r.ga?3:r.gf===r.ga?1:0;
  const raw=(pts-1.37)/1.63,res=r.ex!=null?(pts-r.ex)/1.8:raw;s+=k*(raw*.4+res*.6+clamp((r.gf-r.ga)/4,-.5,.5)*.3);w+=k});
 return clamp(s/w,-1,1)}
function formStr(c){return ((c&&c.rf)||[]).slice(-5).map(r=>r.gf>r.ga?'W':r.gf===r.ga?'D':'L')}
// 상대 전적: 최근 맞대결 6경기 (게임 내 누적)
const h2hKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function h2hList(a,b){return (G.h2h&&G.h2h[h2hKey(a,b)])||[]}
function h2hRec(a,b){const r={w:0,d:0,l:0,gf:0,ga:0,n:0,list:[]};h2hList(a,b).forEach(m=>{const gf=m.h===a?m.hg:m.ag,ga=m.h===a?m.ag:m.hg;r.n++;r.gf+=gf;r.ga+=ga;gf>ga?r.w++:gf<ga?r.l++:r.d++;r.list.push({gf,ga,h:m.h===a,s:m.s})});return r}
function h2hScore(a,b){const L=h2hList(a,b);if(!L.length)return 0;let s=0,w=0;const n=L.length;
 L.forEach((m,i)=>{const k=Math.pow(.8,n-1-i);const gf=m.h===a?m.hg:m.ag,ga=m.h===a?m.ag:m.hg;s+=k*(Math.sign(gf-ga)+clamp((gf-ga)*.15,-.45,.45));w+=k});
 return clamp(s/w,-1,1)*Math.min(1,n/3)} // 맞대결 표본이 적으면 영향 축소
// 경기 맥락 배율 (홈·폼·상대전적)
function matchCtx(hId,aId,fx){
 const neu=!!(fx&&fx.neutral);const H=club(hId),A=club(aId);
 const f={h:formScore(H),a:formScore(A)},hh=h2hScore(hId,aId);const h2={h:hh,a:-hh};
 const atk={},info={};
 ['h','a'].forEach(s=>{const ha=neu?1:s==='h'?RX.home:RX.away;const fm=1+RX.form*f[s],hm=1+RX.h2h*h2[s];atk[s]=ha*fm*hm;info[s]={home:ha,form:fm,h2h:hm}});
 return {atk,info,neu,poss:neu?0:.025,card:{h:neu?1:.92,a:neu?1:1.09},form:f,h2h:h2}}
// 전술 상성 지수: 각 공격 루트(중앙·측면·뒷공간·공중볼)와 빌드업·결정력의 공격/수비 비율을 루트 선호도로 가중
function tacIdx(A,tA,D,tD){const mu=matchupOf(A,tA,D,tD);const M={};mu.forEach(o=>M[o.k]=o);
 const rw={cen:A.cr/60*M.cen.w,wid:A.wid/60*M.wid.w,run:(A.run*.6+A.aer*.4)/60*M.run.w};const t=rw.cen+rw.wid+rw.run||1;
 let x=0;['cen','wid','run'].forEach(k=>x+=rw[k]/t*Math.log(k==='run'?M.run.r*.65+M.aer.r*.35:M[k].r));
 return x*.75+Math.log(M.aer.r)*.08+Math.log(M.bu.r)*.12+Math.log(M.fin.r)*.3}
// 경기 전 기대 득점 (λ) — 백그라운드 경기·예상 승률·폼 기대치에 공통 사용
function expGoals(hId,aId,fx,o){
 o=o||{};const H=club(hId),A=club(aId);const cx=o.cx||matchCtx(hId,aId,fx);
 const Ph={h:o.Ph?o.Ph.h:phasesOf(H),a:o.Ph?o.Ph.a:phasesOf(A)};const T={h:H.tac,a:A.tac};
 const r={h:o.r?o.r.h:teamRating(H),a:o.r?o.r.a:teamRating(A)};
 const d=clamp(r.h-r.a,-20,20);
 const ti={h:tacIdx(Ph.h,T.h,Ph.a,T.a),a:tacIdx(Ph.a,T.a,Ph.h,T.h)};const te=clamp(ti.h-ti.a,-.35,.35);
 // 경기 운영 성향 (상대 전력에 따라 AI 정신력 조정)
 const ment={};['h','a'].forEach(s=>{const c=s==='h'?H:A;const base=T[s].ment||3;
  if(c.id===G.myId||o.fixedMent){ment[s]=base;return}const dd=(s==='h'?d:-d)+(cx.neu?0:s==='h'?1.5:-1.5);ment[s]=clamp(base+(dd>3?1:dd<-3?-1:0),1,5)});
 const lam={};['h','a'].forEach(s=>{const o2=s==='h'?'a':'h';const sg=s==='h'?1:-1;
  lam[s]=RX.base*Math.exp(RX.q*sg*d+RX.tac*.5*sg*te)*(1+RX.ment*(ment[s]-3))*(1+RX.ment*.6*(ment[o2]-3))*cx.atk[s];
  lam[s]=clamp(lam[s],.15,4.2)});
 // 점유율: 빌드업·중원·압박 + 패스 성향 + 홈
 const cH=ctrlOf(Ph.h,T.h),cA=ctrlOf(Ph.a,T.a);let poss=Math.pow(cH,4)/(Math.pow(cH,4)+Math.pow(cA,4))+cx.poss+((T.h.press||2)-(T.a.press||2))*.012;
 return {lam,poss:clamp(poss,.28,.72),cx,ti,d,ment}}
// 포아송 기반 승·무·패 확률
function wdl(lh,la){const pf=(l,k)=>{let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p};let w=0,d=0,l=0;
 for(let i=0;i<=10;i++)for(let j=0;j<=10;j++){let p=pf(lh,i)*pf(la,j);
  if(i===0&&j===0)p*=1.08;else if(i===1&&j===1)p*=1.05;else if(i+j===1)p*=.97; // 저득점 무승부 보정(딕슨-콜스)
  i>j?w+=p:i<j?l+=p:d+=p}const t=w+d+l;return {w:w/t,d:d/t,l:l/t}}
function recordForm(c,gf,ga,ex){c.rf=c.rf||[];c.rf.push({gf,ga,ex:ex!=null?Math.round(ex*100)/100:null});if(c.rf.length>6)c.rf.shift()}
function recordH2H(hId,aId,hg,ag){G.h2h=G.h2h||{};const k=h2hKey(hId,aId);const L=G.h2h[k]=G.h2h[k]||[];L.push({s:G.season,h:hId,hg,ag});if(L.length>6)L.shift()}

// ================= AI 전술 =================
function aiPrepare(c,opp,home){
 const sty=STYLES[c.style]||STYLES.balanced;
 let best=sty.forms[0],bv=-1;
 sty.forms.forEach((f,k)=>{applyPreset(c.tac,f);autoXI(c);autoRoles(c,sty);const v=teamScore(c)*(1+.006*(sty.forms.length-k));if(v>bv){bv=v;best=f}});
 applyPreset(c.tac,best);autoXI(c);autoRoles(c,sty);
 const t=c.tac;['ment','press','tempo','width','line','pass'].forEach(k=>t[k]=sty[k]);
 const diff=teamRating(c)-teamRating(opp)+(home?1.5:-1.5);
 if(diff>3)t.ment=Math.min(5,t.ment+1);if(diff<-3)t.ment=Math.max(1,t.ment-1);
 // 상대를 분석해 상성 대응
 const Pm=phasesOf(c),Po=phasesOf(opp);const ot=opp.tac;
 if(Po.run/(Pm.dsp/LINEX[t.line-1])>1.06&&t.line>1)t.line--;
 if(Pm.run/(Po.dsp/LINEX[(ot.line||2)-1])>1.08)t.pass=3;
 if(Po.bu<Pm.prs*.97&&t.press<3)t.press++;
 if(Pm.wid/Po.dfw>Pm.cr/Po.dfc*1.06)t.width=3;else if(Pm.cr/Po.dfc>Pm.wid/Po.dfw*1.06)t.width=Math.min(t.width,2);
}

// ================= 경기 엔진 =================
const MENT_ATT=[.74,.87,1,1.13,1.26],MENT_VUL=[.8,.9,1,1.1,1.24];
const LVL_KO=['낮음','보통','높음'];
const MENT_KO=['매우 수비적','수비적','균형','공격적','총공세'];
const blankSt=()=>({poss:0,sh:0,sot:0,xg:0,big:0,cor:0,fo:0,yc:0,rc:0,pa:0,pc:0,tk:0,int:0,cr:0,off:0,sv:0,dr:0});
const blankPs=()=>({pa:0,pc:0,kp:0,sh:0,sot:0,xg:0,tk:0,int:0,dr:0,cr:0,sv:0,lost:0,fo:0});
const HEAD={cross:1,knock:1,corner:1};
class Match{
 constructor(hId,aId,live,fx){
  this.h=hId;this.a=aId;this.live=live;this.fx=fx||null;this.cx=matchCtx(hId,aId,fx);this.min=0;this.end=90+ri(2,5);this.htEnd=45+ri(1,3);this.half=1;
  this.sc={h:0,a:0};this.st={h:blankSt(),a:blankSt()};this.ev=[];this.done=false;
  this.tac={h:clone(club(hId).tac),a:clone(club(aId).tac)};
  this.xi={h:[...this.tac.h.xi],a:[...this.tac.a.xi]};
  this.subs={h:0,a:0};this.fit={};this.mins={};this.yc={};this.out=new Set();this.injured=new Set();this.red=new Set();
  this.g={};this.as={};this.rt={};this.ps={};this.ball={x:50,y:50,side:null};this.mom=[];this.queue=null;
  ['h','a'].forEach(s=>this.xi[s].forEach(id=>{this.fit[id]=P(id).fit;this.mins[id]=0;this.ps[id]=blankPs()}));
  this.used={h:new Set(this.xi.h),a:new Set(this.xi.a)};
  const E=expGoals(hId,aId,fx,{cx:this.cx,fixedMent:true});this.pre=wdl(E.lam.h,E.lam.a);
 }
 C(s){return club(this[s])}
 other(s){return s==='h'?'a':'h'}
 slots(s){return slotsOf(this.tac[s])}
 onPitch(s){return this.xi[s].filter(Boolean)}
 Ph(s){return phasesCalc(this.tac[s],this.xi[s],this.fit)}
 log(type,s,text,extra){const e={min:this.minLabel(),type,s,text,...(extra||{})};this.ev.push(e);return e}

class LiteMatch{

   const o=wpick(outs,id=>1.6-(P(id).fit||80)/100);const mn=ri(55,85);const lb=T.lab[o];let bi=T.bench.findIndex(p=>p.pos!=='GK'&&fitOf(p.pos,lb)>=.85);if(bi<0)bi=T.bench.findIndex(p=>p.pos!=='GK');if(bi<0)break;

   st.sh=Math.max(this.sc[s],Math.round(st.xg/.105*(.85+R()*.3)));st.sot=clamp(Math.round(st.sh*.36+this.sc[s]*.4+(R()-.5)*2),this.sc[s],st.sh);

   const ids=[...T.on.keys()];const lamS=xs[s];
   ids.forEach(id=>{const p=P(id);const [a,b]=T.on.get(id);const mn=Math.max(1,b-a);this.mins[id]=mn;const f=mn/90;const lb=T.lab[id]||p.pos;const ln=LINE[lb]||LINE[p.pos];

}

  const take=(cp,n)=>{let k=0;while(k<n&&i<tb.length){if(!used.has(tb[i])){add(cp,tb[i]);k++}i++}};
  take('UCL',a);take('UEL',b);take('UECL',c)});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  // 같은 포트 내
  let cyc,bv=1e9;for(let t=0;t<250;t++){const c=shuffle([...P[i]]);let v=0;
   if(n===8){for(let k=0;k<c.length;k++)if(clash(c[k],c[(k+1)%c.length]))v++}else{for(let k=0;k<c.length;k+=2)if(clash(c[k],c[k+1]))v++}

  else for(let k=0;k<cyc.length;k+=2)edges.push(R()<.5?{h:cyc[k],a:cyc[k+1]}:{h:cyc[k+1],a:cyc[k]});

   if(n===8){const s=bestPerm(A,B,s=>{let v=0;for(let k=0;k<A.length;k++){if(clash(A[k],B[s[k]]))v++;if(clash(A[k],B[s[(k+1)%A.length]]))v++}return v});
    for(let k=0;k<A.length;k++){edges.push({h:A[k],a:B[s[k]]});edges.push({h:B[s[(k+1)%A.length]],a:A[k]})}}
   else{const s=bestPerm(A,B,s=>{let v=0;for(let k=0;k<A.length;k++)if(clash(A[k],B[s[k]]))v++;return v});

function scheduleMDs(teams,edges,n){
 for(let attempt=0;attempt<60;attempt++){
  let rem=shuffle(edges.map(e=>({...e})));const mds=[];let ok=true;
  for(let md=0;md<n;md++){
   const adj={};teams.forEach(t=>adj[t]=[]);rem.forEach((e,i)=>{adj[e.h].push(i);adj[e.a].push(i)});
   const used=new Set(),pickd=[];let steps=0;
   const dfs=()=>{if(++steps>20000)return false;let best=null,bc=1e9;for(const t of teams){if(used.has(t))continue;const c=adj[t].filter(i=>!used.has(rem[i].h)&&!used.has(rem[i].a)).length;if(c<bc){bc=c;best=t}}
    if(best===null)return true;if(bc===0)return false;
    const opts=shuffle(adj[best].filter(i=>!used.has(rem[i].h)&&!used.has(rem[i].a)));

 COMP_IDS.forEach(cp=>{const E=G.eu&&G.eu[cp];if(!E)return;

   }else if(s.k!=='LP'){const ties=E.ko[s.k];const decisive=s.leg===ties[0].fx.length-1;if(!decisive)return;
    ties.forEach(t=>resolveTie(cp,t));const W=ties.map(t=>t.w);
    if(s.k==='PO'){const seeds=E.top8;const order=[0,7,3,4,1,6,2,5];E.ko.R16=order.map(i=>mkTie(cp,'R16',seeds[i],W[7-i]))}
    else if(s.k==='F'){E.champ=W[0];const c=club(W[0]);c.rep=clamp(c.rep+(cp==='UCL'?2:1),55,99);G.trophies=G.trophies||{};(G.trophies[W[0]]=G.trophies[W[0]]||[]).push({s:G.season,cp});
     addNews(`🏆 <b>${c.ko}</b>이(가) ${G.season}-${String(G.season+1).slice(2)} ${COMPS[cp].ko} 우승!`,'대항전')}
    else{const nx=STAGES[STAGES.indexOf(s.k)+1];const arr=[];for(let j=0;j<ties.length;j+=2){const x=ties[j].w,y=ties[j+1].w;const hi=lpRankOf(cp,x)<=lpRankOf(cp,y)?[x,y]:[y,x];arr.push(mkTie(cp,nx,hi[0],hi[1]))}E.ko[nx]=arr}
   }
  });
 });

function newGame(myId,len){
 const W=buildWorld();
 G={v:4,devW:0,season:2026,wk:0,len,myId,players:W.players,clubs:W.clubs,news:[],offers:[],history:[],pidSeq:W.pidSeq,lastLg:[],lastEu:null,boardExp:0,trophies:{},growthLog:[]};
 Object.values(G.clubs).forEach(c=>styleSetup(c));
 startSeason();assignNumbers();snapSeasonStart();
 G.boardExp=boardTarget();
 const me=my();
 addNews(`${me.ko} 감독으로 부임했습니다. 이사회 기대 성적: <b>${lgName(me.lg)} ${G.boardExp}위 이내</b>. 이적 예산 ${money(me.budget)}.`,'이사회');
 const es=G.eu&&COMP_IDS.find(cp=>G.eu[cp]&&G.eu[cp].teams.includes(G.myId));

function boardTarget(){const me=my();const arr=lgClubs(me.lg).sort((a,b)=>b.rep-a.rep);return Math.min(arr.length,arr.findIndex(c=>c.id===me.id)+2)}
function snapSeasonStart(){Object.values(G.players).forEach(p=>{if(p.club==='RET'||p.club==='FOR')return;p.ah=p.ah||[];p.ah.push({s:G.season,age:p.age,ovr:p.ovr,pot:p.pot,club:p.club,at:snapAttrs(p)});if(p.ah.length>25)p.ah.shift()})}
function migrate(g){
 G=g;
 if((g.v||1)<4){ // v1~v3 (프리미어리그 단독) → v4 다중 리그로 확장
  Object.values(g.players).forEach(p=>{
   if(!p.at){const ao=p.ao;genAttrs(p);if(ao&&!REAL[p.name]){ATTRS.forEach(k=>p.at[k]=clamp(p.ovr+ao[k],20,99));p.at.gk=p.pos==='GK'?p.ovr:p.at.gk;p.ob=p.ovr-wOvr(p)}}
   const st=blankPSt();Object.assign(st,p.st||{});if(!p.st||p.st.rn==null){const r=p.ratings||[];st.rs=r.reduce((a,b)=>a+b,0);st.rn=r.length}p.st=st;
   p.car=p.car||[];p.ah=p.ah||[];if(p.prof==null)p.prof=Math.round((.75+hash(p.name+'prof')*.5)*100)/100;
   p.stc={EPL:{app:st.app,min:st.min,g:st.g,a:st.a,rs:st.rs,rn:st.rn,cs:st.cs,motm:st.motm}};p.tk=[p.ovr];
  });
  Object.values(g.clubs).forEach(c=>{const cr=CLUBS_RAW.find(x=>x.id===c.id);c.style=c.style||(cr&&cr.style)||'balanced';c.lg='EPL';c.cc='ENG';c.ab=c.id;c.gp=g.round||0;
   if(!c.tac.pos){const f=FORMS[c.tac.form]?c.tac.form:'4-3-3';const xi=c.tac.xi;applyPreset(c.tac,f);c.tac.xi=xi;c.tac.pass=c.tac.pass||2;autoRoles(c)}});
  // 다른 리그 추가
  const W=buildWorld();const names=new Set(Object.values(g.players).map(p=>p.name));let pid=g.pidSeq;const remap={};
  Object.values(W.clubs).forEach(c=>{if(c.lg==='EPL')return;const nc={...c,players:[]};
   c.players.forEach(id=>{const p=W.players[id];if(names.has(p.name))return;const nid='p'+(pid++);p.id=nid;p.club=c.id;g.players[nid]=p;nc.players.push(nid)});
   g.clubs[c.id]=nc;styleSetup(nc)});
  g.pidSeq=pid;
  const round=g.round||0;const oldFx=g.fixtures,oldTb=g.table;
  const keep={};Object.values(g.players).forEach(p=>{keep[p.id]={st:p.st,stc:p.stc,ratings:p.ratings,susp:p.susp}});
  g.euQ=null;startSeason();
  Object.values(g.players).forEach(p=>{const k=keep[p.id];if(k){p.st=k.st;p.stc=k.stc;p.ratings=k.ratings;p.susp=k.susp}});
  Object.values(g.clubs).forEach(c=>{if(c.lg==='EPL')c.gp=round});
  // 프리미어리그 일정·순위 유지
  G.L.EPL.fixtures=oldFx.map(rd=>rd.map(f=>({...f,cp:'EPL',st:'L'})));G.L.EPL.table=oldTb;G.L.EPL.done=round;
  Object.values(g.players).forEach(p=>{if(p.club!=='RET'&&p.club!=='FOR'&&G.clubs[p.club]&&G.clubs[p.club].lg==='EPL'){p.st=p.st||blankPSt()}});
  // 다른 리그는 같은 시점까지 빠르게 진행
  for(let w=0;w<G.cal.length&&G.cal[w].lw<round;w++){weekFixtures(w).forEach(f=>{if(f.cp==='EPL')return;const m=new LiteMatch(f.h,f.a,f).run();applyMatch(m,f)});LG_IDS.forEach(lg=>{if(lg!=='EPL'&&G.L[lg].map.indexOf(G.cal[w].lw)>=0)G.L[lg].done++})}
  G.wk=G.cal.findIndex(c=>c.lw===round);if(G.wk<0)G.wk=G.cal.length;
  delete g.fixtures;delete g.table;delete g.round;delete g.lastResults;
  g.history=(g.history||[]).map(h=>({...h,lg:'EPL'}));g.trophies=g.trophies||{};g.growthLog=g.growthLog||[];g.devW=G.wk;
  assignNumbers();
  Object.values(g.players).forEach(p=>{if(!p.ah.length)p.ah.push({s:g.season,age:p.age,ovr:p.ovr,pot:p.pot,club:p.club,at:snapAttrs(p)})});
  g.v=4;addNews('구버전 저장 파일을 v4(유럽 5대 리그 + 대항전)로 변환했습니다. 유럽대항전은 다음 시즌부터 진행됩니다.','시스템');
 }
 assignNumbers();
 return g;
}
function prepareWeek(){
 const fx=weekFixtures(G.wk);
 fx.forEach(f=>{[['h',f.h,f.a],['a',f.a,f.h]].forEach(([s,id,opp])=>{const c=club(id);
  if(id===G.myId){if(!validXI(c))autoXI(c)}
  else if(f.h===G.myId||f.a===G.myId)aiPrepare(c,club(opp),s==='h');
  else if(!validXI(c))autoXI(c)})});
}
function playWeek(myMatch){
 const w=G.cal[G.wk];const fx=weekFixtures(G.wk);
 const suspBefore=new Set(Object.values(G.players).filter(p=>p.susp>0).map(p=>p.id));
 const played=new Set();
 prepareWeekAI(fx);
 fx.forEach(f=>{let m;
  if(myMatch&&(f.h===G.myId||f.a===G.myId))m=myMatch;else m=new LiteMatch(f.h,f.a,f).run();
  applyMatch(m,f);played.add(f.h);played.add(f.a)});
 if(w.lw!=null){LG_IDS.forEach(lg=>{if(G.L[lg].map.indexOf(w.lw)>=0)G.L[lg].done++});G.lastLg=fx.filter(f=>f.cp===myLg())}
 if(w.ew!=null){const mc=COMP_IDS.find(cp=>G.eu&&G.eu[cp]&&G.eu[cp].teams.includes(G.myId))||'UCL';G.lastEu={ew:w.ew,cp:mc,fx:fx.filter(f=>f.cp===mc)};afterEuroWeek(w.ew)}
 afterWeek(suspBefore,played);
}
function prepareWeekAI(fx){ // AI 구단 전술 주기적 재정비 (부하 분산)
 const k=G.wk%6;Object.values(G.clubs).forEach((c,i)=>{if(c.id!==G.myId&&i%6===k)styleSetup(c)});
 fx.forEach(f=>[f.h,f.a].forEach(id=>{const c=club(id);if(id!==G.myId&&!validXI(c))autoXI(c)}));

function advanceIdle(){let n=0;while(!seasonOver()&&!myFixture()&&n<40){prepareWeek();playWeek(null);n++}}
function applyMatch(m,fx){
 fx.res={h:m.sc.h,a:m.sc.a,st:{h:{xg:m.st.h.xg,poss:m.st.h.poss},a:{xg:m.st.a.xg,poss:m.st.a.poss}},ev:m.ev.filter(e=>['goal','rc'].includes(e.type)).map(e=>({min:e.min,type:e.type,s:e.s,pid:e.pid,aid:e.aid})),motm:m.motm()};
 const T=LEAGUES[fx.cp]?G.L[fx.cp].table:fx.st==='LP'?G.eu[fx.cp].lp.tbl:null;
 if(T){const th=T[m.h],ta=T[m.a];[[th,m.sc.h,m.sc.a],[ta,m.sc.a,m.sc.h]].forEach(([t,f,a])=>{t.p++;t.gf+=f;t.ga+=a;const r=f>a?'W':f<a?'L':'D';t[r==='W'?'w':r==='L'?'l':'d']++;t.pts+=r==='W'?3:r==='D'?1:0;t.form.push(r);t.form=t.form.slice(-5)})}
 if(fx.st==='LP'){const pz=PRIZE[fx.cp];[['h',m.h],['a',m.a]].forEach(([s,id])=>{const o=s==='h'?'a':'h';const r=m.sc[s]>m.sc[o]?pz.w:m.sc[s]===m.sc[o]?pz.d:0;if(r)club(id).budget=Math.round((club(id).budget+r*.55)*10)/10})}
 const cp=fx.cp;
 // 폼·상대 전적 기록 (경기 결과 현실화 모델에 반영)
 ['h','a'].forEach(s=>{const o=s==='h'?'a':'h';const pr=m.pre;recordForm(m.C(s),m.sc[s],m.sc[o],pr?(s==='h'?3*pr.w+pr.d:3*pr.l+pr.d):null)});
 recordH2H(m.h,m.a,m.sc.h,m.sc.a);
 ['h','a'].forEach(s=>{
  const c=m.C(s);const o=m.other(s);c.gp=(c.gp||0)+1;c._top11min=c.players.map(P).map(p=>p.ovr).sort((a,b)=>b-a)[10]||0;const res=m.sc[s]>m.sc[o]?1:m.sc[s]<m.sc[o]?-1:0;
  const conc=m.sc[o];const motm=m.motm();const starters=new Set(m.tac[s].xi);
  c.players.forEach(id=>{const p=P(id);
   if(m.mins[id]){
    const st=p.st,ps=m.ps[id]||blankPs();
    st.app++;if(starters.has(id))st.start++;const mn=Math.min(m.mins[id],95);st.min+=mn;st.g+=m.g[id]||0;st.a+=m.as[id]||0;
    ['sh','sot','kp','pa','pc','tk','int','dr','sv'].forEach(k=>st[k]+=ps[k]||0);st.xg=Math.round((st.xg+ps.xg)*100)/100;
    if(m.rt[id]!=null){st.rs=Math.round((st.rs+m.rt[id])*10)/10;st.rn++}
    const cs=conc===0&&m.mins[id]>=60&&(LINE[p.pos]==='GK'||LINE[p.pos]==='D');if(cs)st.cs++;
    if(motm===id)st.motm++;
    p.stc=p.stc||{};const sc=p.stc[cp]=p.stc[cp]||{app:0,min:0,g:0,a:0,rs:0,rn:0,cs:0,motm:0};
    sc.app++;sc.min+=mn;sc.g+=m.g[id]||0;sc.a+=m.as[id]||0;if(m.rt[id]!=null){sc.rs=Math.round((sc.rs+m.rt[id])*10)/10;sc.rn++}if(cs)sc.cs++;if(motm===id)sc.motm++;
    p.ratings.push(m.rt[id]);p.ratings=p.ratings.slice(-8);
    p.fit=Math.round(m.fit[id]);p.mor=clamp(p.mor+(res>0?6:res<0?-6:1)+((m.rt[id]||6.5)-6.6)*3,10,100);
    if(m.yc[id]===1&&!m.red.has(id)){st.yc++;if(st.yc%5===0){p.susp=1;if(c.id===G.myId)addNews(`<b>${p.name}</b> 경고 누적(5장)으로 다음 경기 출장 정지.`,'징계')}}
    if(m.red.has(id)){st.rc++;p.susp=m.yc[id]>=2?1:3;if(c.id===G.myId)addNews(`<b>${p.name}</b> 퇴장으로 ${p.susp}경기 출장 정지.`,'징계')}
   }else{
    if(p.ovr>=c._top11min&&avail(p))p.mor=clamp(p.mor-2,10,100);
    else p.mor=clamp(p.mor+(res>0?2:res<0?-2:0),10,100);
   }
   if(m.injured.has(id)){p.inj=ri(1,5);if(p.inj>=4&&p.age>=28)p.at.pac=clamp(p.at.pac-.6,15,99);if(c.id===G.myId)addNews(`<b>${p.name}</b> 부상 — 약 ${p.inj}경기 결장 예상.`,'의료')}
  });
 });
}

function makeOffer(p,mult,unsolicited){
 const v=playerValue(p);const amt=Math.round(v*mult*10)/10;
 const buyers=Object.values(G.clubs).filter(c=>c.id!==G.myId&&c.budget>=amt&&c.players.length<35&&c.rep>=p.ovr-10);
 const from=buyers.length&&R()<.8?wpick(buyers,c=>c.rep-60).id:'F:'+pick(FOREIGN);
 if(G.offers.some(o=>o.pid===p.id&&o.from===from))return;
 G.offers.push({id:'o'+Date.now()+ri(0,999),pid:p.id,from,amt,r:G.wk});
 addNews(`${fromName(from)}이(가) <b>${p.name}</b>에게 ${money(amt)} 이적 제안을 보냈습니다.${unsolicited?' (비공개 접근)':''}`,'이적');
}
// AI 구단 간 이적 (리그 간 이동 포함)
function aiTransfers(n){
 const clubsA=Object.values(G.clubs).filter(c=>c.id!==G.myId&&c.budget>8);
 const pool=Object.values(G.players).filter(p=>G.clubs[p.club]&&p.club!==G.myId&&p.inj<=0);
 for(let k=0;k<n;k++){
  const b=wpick(clubsA,c=>Math.pow(Math.max(1,c.rep-62),1.6)*Math.min(1,c.budget/40));if(!b)return;
  const sq=b.players.map(P);
  // 가장 약한 포지션 찾기
  const need=POS_ORDER.map(pos=>{const ps=sq.filter(p=>p.pos===pos).sort((x,y)=>y.ovr-x.ovr);const want=pos==='CB'?2:pos==='CM'?2:1;const v=ps.length>=want?ps[want-1].ovr:50;return{pos,v}}).sort((x,y)=>x.v-y.v)[0];
  const cands=[];for(let t=0;t<260;t++){const p=pick(pool);if(p.pos!==need.pos||p.club===b.id)continue;const s=club(p.club);
   if(s.rep>b.rep+2||s.players.length<=19||p.ovr<need.v+2||p.ovr>clubStr(b)+6)continue;const price=askPrice(p);if(price>b.budget*.65)continue;
   if(p.pos==='GK'&&s.players.filter(id=>P(id).pos==='GK').length<=2)continue;cands.push({p,price})}
  if(!cands.length)continue;
  const best=cands.sort((x,y)=>(y.p.ovr+(y.p.pot-y.p.ovr)*.3-y.price*.05)-(x.p.ovr+(x.p.pot-x.p.ovr)*.3-x.price*.05))[0];
  const p=best.p,s=club(p.club),price=best.price;
  s.players=s.players.filter(id=>id!==p.id);s.tac.xi=s.tac.xi.map(id=>id===p.id?null:id);s.budget=Math.round((s.budget+price)*10)/10;
  b.players.push(p.id);b.budget=Math.round((b.budget-price)*10)/10;p.club=b.id;p.listed=0;p.no=0;
  p.hist.push(`${G.season} ${s.ko}→${b.ko} ${money(price)}`);
  if(p.ovr>=80||b.lg===myLg()||s.lg===myLg())addNews(`[이적] <b>${p.name}</b>(${p.ovr}) ${s.ko} → ${b.ko}, ${money(price)}`,'이적');
  if(!validXI(s))autoXI(s);
  while(b.players.length>35){const w=b.players.map(P).filter(q=>q.pos!=='GK').sort((x,y)=>(x.ovr-(x.age>=31?3:0))-(y.ovr-(y.age>=31?3:0)))[0];b.players=b.players.filter(id=>id!==w.id);b.tac.xi=b.tac.xi.map(id=>id===w.id?null:id);w.club='FOR';w.hist.push(`${G.season} ${b.ko}→해외 이적`)}
 }
 assignNumbers();
}

// 연간 기대 변화량(OVR 포인트)을 4주 단위로 나눠 적용. 나이·잠재력 여유·출전 비율·평점·훈련·성실성이 영향.
const GROW_M=a=>({pac:a<=21?1.2:.45,phy:a<=23?1.3:.6,fin:1,pas:1,vis:1.15,dri:a<=23?1.1:.7,def:1,gk:1});
const DECL_M=a=>({pac:1.8,phy:a>=32?1.4:.8,dri:1,fin:.55,pas:.25,vis:-.2,def:.7,gk:.8});
function devFactors(p,c){
 c=c||G.clubs[p.club];const a=p.age,gap=p.pot-p.ovr;
 const base=a<=18?5:a<=20?4:a<=22?3:a<=24?1.8:a<=26?.8:a<=28?.25:0;
 const gapF=clamp(gap/5,0,1.2);
 const gp=c?Math.max(1,c.gp||0):1;const share=c&&c.gp?clamp(p.st.min/(gp*90),0,1):.5;
 const playF=.45+.9*Math.min(1,share/.6);
 const ar=p.st.rn?p.st.rs/p.st.rn:6.6;const rateF=1+clamp((ar-6.8)*.35,-.25,.35);
 const trainF=[0,.8,1,1.25][(c&&c.train)||2];
 const g=base*gapF*playF*rateF*trainF*p.prof;
 let d=a<=29?0:a<=30?-.8:a<=31?-1.3:a<=32?-2:a<=33?-2.8:a<=34?-3.5:-4.5;d*=(p.prof>1.05?.85:p.prof<.9?1.15:1)*(p.leg?.75:1);
 return {base,gapF,share,playF,ar,rateF,trainF,g,d,total:g+d};
}
function devAnnual(p,c){return devFactors(p,c).total}
function devApply(p,delta){
 if(Math.abs(delta)<1e-4)return;
 const cur=wOvr(p)+p.ob;
 if(delta>0&&cur+delta>p.pot+.45)delta=Math.max(0,p.pot+.45-cur);
 const M=delta>0?GROW_M(p.age):DECL_M(p.age);const W=OVR_W[archGroup(p.pos)];
 let den=0;for(const k in W)den+=W[k]*M[k];if(den<=0)return;
 const keys=[...ATTRS,'gk'];
 keys.forEach(k=>{if(k==='gk'&&p.pos!=='GK')return;let v=delta*M[k]/den;v+=(R()-.5)*.3*Math.abs(delta);p.at[k]=clamp(p.at[k]+v,15,99)});
 recalcOvr(p);
}
function devTick(frac){
 const report=[];
 Object.values(G.players).forEach(p=>{if(p.club==='RET'||p.club==='FOR')return;const c=G.clubs[p.club];
  const before=p.ovr;let d=devAnnual(p,c)*frac+(R()-.5)*.5*Math.sqrt(frac);
  devApply(p,d);p.tk=p.tk||[];p.tk.push(p.ovr);
  if(c&&c.id===G.myId&&p.ovr!==before)report.push({p,o:before});
 });
 if(report.length){report.sort((a,b)=>Math.abs(b.p.ovr-b.o)-Math.abs(a.p.ovr-a.o));
  addNews('훈련 리포트 — '+report.slice(0,8).map(r=>`<b>${lastName(r.p.name)}</b> ${r.o}→${r.p.ovr} ${r.p.ovr>r.o?'<span class="good">▲</span>':'<span class="bad">▼</span>'}`).join(', ')+(report.length>8?` 외 ${report.length-8}명`:''),'코치')}
}

 if(T.aer.r>1.06)tips.push(['b',`상대 공중볼이 위협적입니다 (${pctTxt(T.aer.r)}). 스토퍼(NCB)·앵커로 박스 수비를 강화하세요.`]);
 if(T.wid.r>1.06)tips.push(['b',`상대 측면 공격에 취약합니다 (${pctTxt(T.wid.r)}). 풀백 임무를 '수비'로, 와이드 미드필더로 측면을 보호하세요.`]);
 if(T.cen.r>1.06)tips.push(['b',`중앙이 열려 있습니다 (${pctTxt(T.cen.r)}). 앵커/수비형 미드를 추가하거나 라인 간격을 좁히세요.`]);
 if(Pm.bu<Po.prs*.97)tips.push(['b',`상대 압박이 우리 빌드업보다 강합니다. 패스 길이 '직선'으로 압박을 건너뛰거나 볼 플레잉 디펜더·DLP를 배치하세요.`]);
 if(Pm.gap>1)tips.push(['b',t.press===3?`높은 압박 + 낮은 수비 라인은 라인 사이 공간을 크게 벌립니다.`:`낮은 압박 + 높은 라인은 상대에게 여유를 줍니다.`]);

}

function reassign(ids,tac){ // 선발 선수를 새 포메이션에 최적 배치
 const slots=slotsOf(tac);const xi=new Array(11).fill(null);const left=new Set(ids.filter(Boolean));
 const order=slots.map((s,i)=>i).sort((a,b)=>SLOT_PRI.indexOf(slots[a][0])-SLOT_PRI.indexOf(slots[b][0]));
 for(const pass of [1,0])order.forEach(i=>{const s=slots[i];if(xi[i])return;let b=null,bv=-1;left.forEach(id=>{const f=fitOf(P(id).pos,s[0]);if(pass&&f<.99)return;const v=P(id).ovr*f;if(v>bv){bv=v;b=id}});if(b){xi[i]=b;left.delete(b)}});
 return xi;
}

// ---------- 드래그 엔진 (마우스·터치 공용 Pointer Events) ----------
const DND={el:null};
function pitchXY(cx,cy){const pe=$('#pitchEl');if(!pe)return null;const r=pe.getBoundingClientRect();return[(cx-r.left)/r.width*100,100-(cy-r.top)/r.height*100]}
function dragTac(ctx){return ctx==='live'?LM.m.tac[LM.side]:my().tac}
function dragXI(ctx){return ctx==='live'?LM.m.xi[LM.side]:my().tac.xi}
function dndInit(){
 if(window.__dnd)return;window.__dnd=1;
 const begin=(el,x,y,touch)=>{const cx=el.closest('[data-ctx]');DND.el=el;DND.src=el.dataset.drag;DND.sx=x;DND.sy=y;DND.qx=x;DND.qy=y;DND.on=false;DND.touch=touch;DND.ctx=cx?cx.dataset.ctx:'plan'};
 const finish=(x,y)=>{if(!DND.el)return;clearTimeout(DND.lp);if(DND.raf){cancelAnimationFrame(DND.raf);DND.raf=0}const src=DND.src,ctx=DND.ctx;
  if(DND.on){const tgt=dropTarget(x,y);endDrag();DND.el=null;handleDrop(ctx,src,tgt,x,y)}else{DND.el=null;handleClick(ctx,src)}};
 const skip=t=>t.closest('button,select,input,a,textarea');
 // 마우스 · 펜
 document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button>0)return;const el=e.target.closest('[data-drag]');if(!el||skip(e.target))return;begin(el,e.clientX,e.clientY,null);e.preventDefault()});
 document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!DND.el||DND.touch!=null)return;if(!DND.on){if(Math.hypot(e.clientX-DND.sx,e.clientY-DND.sy)<5)return;startDrag()}queueGhost(e.clientX,e.clientY)});
 document.addEventListener('pointerup',e=>{if(e.pointerType==='touch'||DND.touch!=null)return;finish(e.clientX,e.clientY)});
 document.addEventListener('pointercancel',e=>{if(e.pointerType!=='touch')cancelDnd()});
 // 터치 (iPhone Safari): 피치 선수는 즉시 드래그, 벤치 카드는 가로로 끌거나 살짝 길게 누르면 드래그 · 세로로 밀면 스크롤
 const tOf=e=>{for(const t of e.changedTouches)if(t.identifier===DND.tid)return t;return null};
 document.addEventListener('touchstart',e=>{if(e.touches.length>1){cancelDnd();return}const el=e.target.closest('[data-drag]');if(!el||skip(e.target))return;const t=e.changedTouches[0];
  begin(el,t.clientX,t.clientY,1);DND.tid=t.identifier;DND.instant=!!el.closest('.pitch');
  if(DND.instant)e.preventDefault();
  else{clearTimeout(DND.lp);DND.lp=setTimeout(()=>{if(DND.el&&!DND.on){startDrag();moveGhost(DND.qx,DND.qy);try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}}},220)}
 },{passive:false});
 document.addEventListener('touchmove',e=>{if(!DND.el||DND.touch==null)return;const t=tOf(e);if(!t)return;const x=t.clientX,y=t.clientY;
  if(!DND.on){const dx=x-DND.sx,dy=y-DND.sy;
   if(Math.hypot(dx,dy)<(DND.instant?3:7)){if(DND.instant)e.preventDefault();return}
   if(!DND.instant&&Math.abs(dy)>Math.abs(dx)*1.15){clearTimeout(DND.lp);DND.el=null;DND.touch=null;return} // 세로 스와이프 → 목록 스크롤
   clearTimeout(DND.lp);startDrag()}
  e.preventDefault();queueGhost(x,y)},{passive:false});
 document.addEventListener('touchend',e=>{if(!DND.el||DND.touch==null)return;const t=tOf(e);if(!t)return;e.preventDefault();DND.touch=null;finish(t.clientX,t.clientY)},{passive:false});
 document.addEventListener('touchcancel',()=>{if(DND.touch!=null)cancelDnd()});
 window.addEventListener('blur',()=>cancelDnd());
}
function cancelDnd(){clearTimeout(DND.lp);if(DND.raf){cancelAnimationFrame(DND.raf);DND.raf=0}if(DND.on)endDrag();DND.el=null;DND.touch=null}
function queueGhost(x,y){DND.qx=x;DND.qy=y;if(!DND.raf)DND.raf=requestAnimationFrame(()=>{DND.raf=0;if(DND.on)moveGhost(DND.qx,DND.qy)})}
function startDrag(){
 DND.on=true;document.body.classList.add('dragging');DND.el.classList.add('drag-src');
 const [t,v]=DND.src.split(':');let id=t==='bench'?v:dragXI(DND.ctx)[+v];const p=id?P(id):null;
 const cl=DND.ctx==='live'?LM.m.C(LM.side):my();
 const g=document.createElement('div');g.className='dndghost';
 g.innerHTML=`<div class="dot" style="background:${p?cl.c1:'#444'};color:${lum(cl.c1)>.55?'#111':'#fff'}">${p?p.ovr:'·'}</div><div class="gl">${p?lastName(p.name):'빈 자리'}</div>`;
 g.style.left='0px';g.style.top='0px';g.style.willChange='transform';document.body.appendChild(g);DND.ghost=g;DND.hi=null;DND.lastLbl=null;moveGhost(DND.qx!=null?DND.qx:DND.sx,DND.qy!=null?DND.qy:DND.sy);
}
function dropTarget(x,y){const el=document.elementFromPoint(x,y);return el?el.closest('[data-drop]'):null}
function moveGhost(x,y){
 const g=DND.ghost;if(!g)return;const up=DND.touch!=null?-62:0; // 터치: 손가락에 가리지 않도록 위로 띄움
 g.style.transform=`translate3d(${x}px,${y+up}px,0) translate(-50%,-50%)`;
 const t=dropTarget(x,y);if(t!==DND.hi){if(DND.hi)DND.hi.classList.remove('drop-hi');if(t)t.classList.add('drop-hi');DND.hi=t}
 const [st,sv]=DND.src.split(':');let lbl='';
 if(t){const d=t.dataset.drop;
  if(d==='pitch'&&st==='slot'){const xy=pitchXY(x,y);const i=+sv;const c=clampPos(i,xy[0],xy[1]);lbl='→ '+POSKO[posLabel(c[0],c[1],i)]+' 이동'}
  else if(d.startsWith('slot:')){const j=+d.split(':')[1];const o=dragXI(DND.ctx)[j];lbl=st==='bench'?(o?'⇄ '+lastName(P(o).name)+' 교체':'↓ 투입'):(+sv===j?'위치 조정':(o?'⇄ 자리 교환':'↓ 빈 자리로'))}
  else if(d==='bench'&&st==='slot')lbl=DND.ctx==='live'?'✕ 경기 중 불가':'↩ 선발 제외';
  else if(d==='pitch'&&st==='bench')lbl='선수 위에 놓으세요';
 }
 if(lbl!==DND.lastLbl){DND.lastLbl=lbl;const gl=g.querySelector('.gl');if(gl)gl.innerHTML=(DND.lbl0||(DND.lbl0=gl.textContent))+(lbl?` <span style="color:var(--gold)">${lbl}</span>`:'')}
}
function endDrag(){document.body.classList.remove('dragging');if(DND.hi)DND.hi.classList.remove('drop-hi');DND.hi=null;DND.lastLbl=null;if(DND.ghost)DND.ghost.remove();DND.ghost=null;DND.lbl0=null;document.querySelectorAll('.drop-hi').forEach(e=>e.classList.remove('drop-hi'));if(DND.el)DND.el.classList.remove('drag-src');DND.on=false}
function nearestSlot(ctx,cx,cy,maxd){const xy=pitchXY(cx,cy);if(!xy)return null;const sl=slotsOf(dragTac(ctx));let b=null,bd=1e9;sl.forEach((s,i)=>{const d=Math.hypot(s[1]-xy[0],(s[2]-xy[1])*.7);if(d<bd){bd=d;b=i}});return bd<=maxd?b:null}
function reposition(ctx,i,cx,cy){
 const t=dragTac(ctx);const xy=pitchXY(cx,cy);if(!xy)return;const before=posLabel(t.pos[i][0],t.pos[i][1],i);
 t.pos[i]=clampPos(i,xy[0],xy[1]);fixRole(t,i);const after=posLabel(t.pos[i][0],t.pos[i][1],i);
 if(before!==after){const id=dragXI(ctx)[i];toast(`${id?lastName(P(id).name):'자리'}: ${POSKO[before]} → <b>${POSKO[after]}</b> (역할: ${ROLES[t.roles[i].r].ko})`)}
}
function handleDrop(ctx,src,tgt,cx,cy){
 const [st,sv]=src.split(':');let dt=null,dv=null;if(tgt){const a=tgt.dataset.drop.split(':');dt=a[0];dv=a[1]}
 if(ctx==='live')return liveDrop(st,sv,dt,dv,cx,cy);
 const c=my(),t=c.tac,xi=t.xi;
 if(st==='slot'){const i=+sv;
  if(dt==='slot'){const j=+dv;if(i===j)reposition(ctx,i,cx,cy);else{const a=xi[i];xi[i]=xi[j];xi[j]=a;S.sel=j;toast('자리를 교환했습니다.')}}
  else if(dt==='pitch'){reposition(ctx,i,cx,cy);S.sel=i}
  else if(dt==='bench'){if(xi[i]){toast(`${P(xi[i]).name} 선발 제외`);xi[i]=null}}
 }else if(st==='bench'){const id=sv;const p=P(id);
  if(!avail(p))return toast('부상·징계 선수는 출전할 수 없습니다.');
  let j=dt==='slot'?+dv:dt==='pitch'?nearestSlot(ctx,cx,cy,12):null;
  if(j==null)return render();
  const out=xi[j];xi[j]=id;S.sel=j;toast(out?`${p.name} ⇄ ${P(out).name}`:`${p.name} 선발 투입`);
 }
 render();
}
function liveDrop(st,sv,dt,dv,cx,cy){
 const m=LM.m,s=LM.side,xi=m.xi[s];m.dirty=true;
 if(st==='slot'){const i=+sv;
  if(dt==='slot'){const j=+dv;if(i===j)reposition('live',i,cx,cy);
   else if(!xi[j]){toast('부상 자리는 벤치 선수로 교체해 채우세요.')}
   else{const a=xi[i];xi[i]=xi[j];xi[j]=a;LM.sel=j;toast('자리를 교환했습니다.')}}
  else if(dt==='pitch'){reposition('live',i,cx,cy);LM.sel=i}
  else if(dt==='bench')toast('경기 중에는 벤치 선수를 이 선수 위로 끌어와 교체하세요.');
 }else if(st==='bench'){const id=sv;
  let j=dt==='slot'?+dv:dt==='pitch'?nearestSlot('live',cx,cy,12):null;
  if(j!=null){
   const out=xi[j]||(m.pendingInjury&&m.holeIdx&&m.holeIdx[s]===j?m.pendingInjury:null);
   if(!out)toast('교체할 선수 위에 놓아주세요.');
   else if(m.subs[s]>=5)toast('교체 카드를 모두 사용했습니다 (5/5).');
   else if(m.doSub(s,out,id)){LM.sel=j;toast(`🔄 ${P(id).name} IN · ${P(out).name} OUT (${m.subs[s]}/5)`)}
  }
 }
 closeTac();openTacModal();updateMatchUI();
}
function handleClick(ctx,src){
 const [st,sv]=src.split(':');
 if(ctx==='live'){const m=LM.m,s=LM.side;
  if(st==='slot'){LM.sel=LM.sel===+sv?null:+sv}
  else if(st==='bench'&&LM.sel!=null){const out=m.xi[s][LM.sel]||(m.pendingInjury&&m.holeIdx[s]===LM.sel?m.pendingInjury:null);
   if(out&&m.subs[s]<5&&m.doSub(s,out,sv))toast(`🔄 ${P(sv).name} IN · ${P(out).name} OUT`);else toast('교체할 수 없습니다.')}
  else if(st==='bench')toast('먼저 피치에서 교체할 선수를 클릭하거나, 벤치 선수를 끌어 놓으세요.');
  closeTac();openTacModal();updateMatchUI();return}
 if(st==='slot'){S.sel=S.sel===+sv?null:+sv;render()}
 else if(st==='bench'){if(S.sel!=null){const xi=my().tac.xi;const p=P(sv);if(!avail(p))return toast('출전할 수 없는 선수입니다.');const k=xi.indexOf(sv);const out=xi[S.sel];if(k>=0)xi[k]=out;xi[S.sel]=sv;render();toast(`${p.name} 배치`)}else playerModal(sv)}
}

 <div class="card" style="padding:6px 8px"><div class="mut" style="font-size:12px;padding:6px 8px">검색 결과 ${total}명 · <span class="gen">†</span> 가상 선수</div><table><thead><tr><th>포지션</th><th>이름</th><th>클럽</th><th>리그</th><th class="n">나이</th><th class="n">능력</th><th class="n">잠재</th><th class="n">시즌 변화</th><th class="n">가치</th><th class="n">요구 이적료</th><th></th></tr></thead><tbody>

 ${total>pg*100?`<div style="text-align:center;padding:10px"><button onclick="S.tpg=${pg+1};render()">더 보기 (${Math.min(100,total-pg*100)}명)</button></div>`:''}</div>`;

// ================= 선수 상세 · 능력치 기록 =================
const ATTR_COL={pac:'#4aa3ff',fin:'#ef5350',pas:'#3ddc84',vis:'#ffd166',dri:'#c77dff',def:'#f5a623',phy:'#9aa59f',gk:'#ffd166'};
function seasonRows(p){ // 시즌별 시작→종료 능력치
 const rows=(p.ah||[]).map((h,i)=>{const live=i===p.ah.length-1&&h.s===G.season;const end=h.end||(live?{ovr:p.ovr,pot:p.pot,at:snapAttrs(p)}:null);
  return {s:h.s,age:h.age,club:h.club2||h.club||p.club,o:h.ovr,pot0:h.pot,at0:h.at,end,live,tk:live?p.tk:h.tk,min:live?p.st.min:h.min,app:live?p.st.app:h.app,r:live?(p.st.rn?Math.round(p.st.rs/p.st.rn*100)/100:null):h.r}});
 return rows;
}
function attrHistTable(p){
 const rows=seasonRows(p);if(!rows.length)return '<p class="mut">기록 없음</p>';
 const ks=p.pos==='GK'?['gk','pas','pac','phy']:ATTRS;
 const cell=(v,d)=>`<td class="n">${v}${d?`<sup class="${d>0?'good':'bad'}" style="font-size:9.5px;margin-left:1px">${d>0?'+':''}${d}</sup>`:''}</td>`;
 return `<div style="overflow:auto"><table class="stbl"><thead><tr><th>시즌</th><th class="n">나이</th><th>클럽</th><th class="n">경기</th><th class="n">평점</th><th class="n">OVR 시작→종료</th><th class="n">변화</th><th class="n">POT</th>${ks.map(k=>`<th class="n" style="color:${ATTR_COL[k]}">${ATTRKO[k].split('/')[0]}</th>`).join('')}</tr></thead><tbody>
 ${rows.map(r=>{const e=r.end;const d=e?e.ovr-r.o:0;return `<tr class="${r.live?'hl':''}"><td>${r.s}-${String(r.s+1).slice(2)}${r.live?' <span class="mut">진행중</span>':''}</td><td class="n">${r.age}</td><td style="font-size:12px">${clubName(r.club)}</td><td class="n">${r.app??'-'}</td><td class="n">${r.r??'-'}</td><td class="n">${r.o} → <b>${e?e.ovr:'?'}</b></td><td class="n">${e?dTag(d)||'<span class="mut">±0</span>':''}</td><td class="n mut">${e?e.pot:r.pot0}</td>${ks.map(k=>{const a0=r.at0?r.at0[k]:null,a1=e&&e.at?e.at[k]:null;return a1!=null?cell(a1,a0!=null?a1-a0:0):'<td class="n mut">-</td>'}).join('')}</tr>`}).join('')}
 </tbody></table></div>`;
}
function attrChart(p){
 const rows=seasonRows(p);const ks=p.pos==='GK'?['gk','pas','pac','phy']:ATTRS;
 const pts=[];rows.forEach((r,i)=>{if(i===0&&r.at0)pts.push({l:String(r.s).slice(2)+'/'+String(r.s+1).slice(2)+' 시작',at:r.at0,o:r.o});if(r.end)pts.push({l:r.live?'현재':String(r.s).slice(2)+'/'+String(r.s+1).slice(2)+' 종료',at:r.end.at,o:r.end.ovr})});
 if(pts.length<2)return '<p class="mut" style="font-size:12px">시즌이 쌓이면 능력치별 추이 그래프가 표시됩니다.</p>';
 const W=900,H=210;const all=pts.flatMap(o=>ks.map(k=>o.at[k]).concat([o.o]));const mn=Math.max(15,Math.min(...all)-3),mx=Math.min(99,Math.max(...all)+3);
 const X=i=>40+(W-70)*i/(pts.length-1),Y=v=>H-22-(H-36)*(v-mn)/Math.max(1,mx-mn);
 const lines=ks.map(k=>`<polyline fill="none" stroke="${ATTR_COL[k]}" stroke-width="1.6" opacity=".9" points="${pts.map((o,i)=>X(i)+','+Y(o.at[k])).join(' ')}"/>`).join('');
 const ovr=`<polyline fill="none" stroke="#fff" stroke-width="2.6" stroke-dasharray="5 3" points="${pts.map((o,i)=>X(i)+','+Y(o.o)).join(' ')}"/>${pts.map((o,i)=>`<circle cx="${X(i)}" cy="${Y(o.o)}" r="3" fill="#fff"/><text x="${X(i)}" y="${Y(o.o)-7}" fill="#fff" font-size="10" text-anchor="middle" font-weight="700">${o.o}</text>`).join('')}`;
 const grid=[0,.25,.5,.75,1].map(f=>{const v=Math.round(mn+(mx-mn)*f);return `<line x1="30" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.07)"/><text x="4" y="${Y(v)+3}" fill="#8ea79a" font-size="9">${v}</text>`}).join('');
 const xl=pts.map((o,i)=>`<text x="${X(i)}" y="${H-6}" fill="#8ea79a" font-size="9" text-anchor="middle">${o.l}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${lines}${ovr}${xl}</svg>
 <div class="row wrap" style="gap:10px;font-size:11.5px">${ks.map(k=>`<span><i style="display:inline-block;width:10px;height:3px;background:${ATTR_COL[k]};vertical-align:middle;margin-right:4px"></i>${ATTRKO[k]}</span>`).join('')}<span><i style="display:inline-block;width:12px;border-top:2px dashed #fff;vertical-align:middle;margin-right:4px"></i>OVR</span></div>`;
}
function tickSpark(arr){
 if(!arr||arr.length<2)return '<span class="mut" style="font-size:11.5px">시즌 진행 중 4주 단위로 기록됩니다.</span>';
 const W=220,H=42,mn=Math.min(...arr)-1,mx=Math.max(...arr)+1;const X=i=>4+(W-8)*i/(arr.length-1),Y=v=>H-6-(H-12)*(v-mn)/Math.max(1,mx-mn);
 const col=arr[arr.length-1]>=arr[0]?'var(--acc)':'var(--bad)';
 return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px"><polyline fill="none" stroke="${col}" stroke-width="2" points="${arr.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${arr.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="2" fill="${col}"/>`).join('')}</svg>`;

function devPanel(p){
 if(p.club==='RET'||p.club==='FOR')return '';
 const f=devFactors(p);const pc=v=>`×${v.toFixed(2)}`;const rowsF=[
  ['나이 기본 성장치',`${f.base.toFixed(1)}`,p.age<=22?'성장기':p.age<=26?'완성기':p.age<=28?'정점':'정점 이후'],

  ['훈련 강도',pc(f.trainF),['','가볍게','보통','강하게'][(G.clubs[p.club]&&G.clubs[p.club].train)||2]],
  ['성실성(숨은 능력)',pc(p.prof),p.prof>=1.1?'매우 성실':p.prof>=.95?'성실':p.prof>=.85?'보통':'게으름'],
  ['노화 감소',f.d?f.d.toFixed(1):'0','30세 전후부터 적용']];
 return `<table class="stbl">${rowsF.map(r=>`<tr><td>${r[0]}</td><td class="n" style="font-weight:800">${r[1]}</td><td class="mut" style="font-size:11.5px">${r[2]}</td></tr>`).join('')}<tr style="border-top:2px solid var(--line)"><td><b>예상 연간 변화</b></td><td class="n" style="font-weight:900" class="${f.total>=0?'good':'bad'}">${f.total>=0?'+':''}${f.total.toFixed(1)}</td><td class="mut" style="font-size:11.5px">OVR 포인트/시즌 (무작위 변동 별도)</td></tr></table>`;
}
function compBreak(p){
 const tot={};const add=(k,a,g,as,rs,rn)=>{const t=tot[k]=tot[k]||{app:0,g:0,a:0,rs:0,rn:0};t.app+=a;t.g+=g;t.a+=as;t.rs+=rs;t.rn+=rn};
 (p.car||[]).forEach(r=>{for(const k in (r.cmp||{})){const x=r.cmp[k];add(k,x.app,x.g,x.a,x.r?x.r*x.app:0,x.r?x.app:0)}});
 for(const k in (p.stc||{})){const x=p.stc[k];add(k,x.app,x.g,x.a,x.rs,x.rn)}
 const ks=Object.keys(tot);if(!ks.length)return '';
 return `<table class="stbl"><thead><tr><th>대회</th><th class="n">이번 시즌 (경기/골/도움)</th><th class="n">통산 경기</th><th class="n">통산 골</th><th class="n">통산 도움</th><th class="n">평균 평점</th></tr></thead><tbody>${ks.map(k=>{const t=tot[k],c=p.stc&&p.stc[k];return `<tr><td>${cTag(k)} ${compName(k)}</td><td class="n">${c?`${c.app} / ${c.g} / ${c.a}`:'-'}</td><td class="n">${t.app}</td><td class="n">${t.g}</td><td class="n">${t.a}</td><td class="n">${t.rn?(t.rs/t.rn).toFixed(2):'-'}</td></tr>`}).join('')}</tbody></table>`;
}

function miniSpark(arr){if(!arr||arr.length<2)return '';const W=70,H=18,mn=Math.min(...arr),mx=Math.max(...arr);const X=i=>2+(W-4)*i/(arr.length-1),Y=v=>H-3-(H-6)*(v-mn)/Math.max(1,mx-mn);const col=arr[arr.length-1]>arr[0]?'#3ddc84':arr[arr.length-1]<arr[0]?'#ef5350':'#8ea79a';return `<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;vertical-align:middle"><polyline fill="none" stroke="${col}" stroke-width="1.6" points="${arr.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/></svg>`}

async function saveGame(){
 const json=JSON.stringify(G);let blob,ext='json';
 try{if(window.CompressionStream){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));blob=await new Response(cs).blob();ext='json.gz'}}catch(e){blob=null}
 if(!blob)blob=new Blob([json],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kickoff_${G.myId}_${seasonLbl()}_W${G.wk+1}.${ext}`;a.click();toast(`저장 파일을 내려받았습니다. (${(blob.size/1e6).toFixed(1)}MB)`);
}
function loadGame(){const i=document.createElement('input');i.type='file';i.accept='.json,.gz,.json.gz';i.onchange=async()=>{const f=i.files[0];if(!f)return;
 try{const buf=new Uint8Array(await f.arrayBuffer());let txt;
  if(buf[0]===0x1f&&buf[1]===0x8b){const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));txt=await new Response(ds).text()}else txt=new TextDecoder().decode(buf);
  const g=JSON.parse(txt);if(!g.clubs||!g.players)throw 0;G=migrate(g);S.tab='home';render();toast('불러오기 완료')}catch(e){console.error(e);toast('저장 파일을 읽을 수 없습니다.')}};i.click()}

function wideMate(s,excl){const m=LM.m;let b=null,bv=-1;m.xi[s].forEach((id,i)=>{if(!id||i===0||id===excl)return;const r=relOf(s,id);const v=Math.abs(r.l-50)+r.a*.3;if(v>bv){bv=v;b=id}});return b}
function chanceActs(c){
 const s=c.s,sh=c.sh,as=c.as;const A=[];const cx={};
 const isL=()=>cx.L!=null?cx.L:(cx.L=relOf(s,cx.cr||as||sh).l<50);const lat=l=>isL()?l:100-l;
 const cr=()=>cx.cr||(cx.cr=(as&&as!==sh?as:wideMate(s,sh)));
 switch(c.type){
  case 'through':if(as)A.push({t:'pass',s,to:as});A.push({t:'pass',s,to:sh,dest:()=>({a:82+R()*5,l:clamp(relOf(s,sh).l,36,64)})});A.push({t:'carry',s,id:sh,dest:()=>{const r=relOf(s,sh);return{a:Math.min(r.a+4,91),l:r.l+(50-r.l)*.3}}});break;
  case 'edge':if(as)A.push({t:'pass',s,to:as});A.push({t:'pass',s,to:sh,dest:()=>({a:72+R()*6,l:32+R()*36})});break;
  case 'dribble':if(as)A.push({t:'pass',s,to:as});A.push({t:'pass',s,to:sh,dest:()=>({a:66+R()*6,l:30+R()*40})});A.push({t:'carry',s,id:sh,dest:()=>({a:85+R()*4,l:40+R()*20}),beat:1});break;
  case 'cross':A.push({t:'pass',s,to:cr,dest:()=>({a:76+R()*6,l:lat(9)})});A.push({t:'carry',s,id:cr,dest:()=>({a:88+R()*3,l:lat(5)})});A.push({t:'pass',s,to:sh,dest:()=>({a:91+R()*4,l:41+R()*18}),loft:1,cross:1});break;
  case 'cutback':A.push({t:'pass',s,to:cr,dest:()=>({a:80+R()*4,l:lat(12)})});A.push({t:'carry',s,id:cr,dest:()=>({a:95,l:lat(22)})});A.push({t:'pass',s,to:sh,dest:()=>({a:85+R()*3,l:42+R()*16})});break;
  case 'cutin':A.push({t:'pass',s,to:sh,dest:()=>({a:76+R()*4,l:lat(12)})});A.push({t:'carry',s,id:sh,dest:()=>({a:83+R()*3,l:lat(34)})});break;
  case 'oneone':if(as)A.push({t:'pass',s,to:as});A.push({t:'pass',s,to:sh,dest:()=>({a:79+R()*5,l:38+R()*24}),loft:1});A.push({t:'carry',s,id:sh,dest:()=>({a:90,l:45+R()*10})});break;
  case 'knock':{const tg=as||sh;A.push({t:'pass',s,to:tg,dest:()=>({a:84+R()*2,l:42+R()*16}),loft:1});if(as)A.push({t:'pass',s,to:sh,dest:()=>({a:87+R()*3,l:38+R()*24}),loft:.4});break}
  case 'counter':if(as)A.push({t:'pass',s,to:as,dest:()=>({a:Math.max(relOf(s,as).a,52)+6+R()*8,l:25+R()*50})});A.push({t:'pass',s,to:sh,dest:()=>({a:80+R()*6,l:36+R()*28})});A.push({t:'carry',s,id:sh,dest:()=>{const r=relOf(s,sh);return{a:Math.min(r.a+5,90),l:r.l+(50-r.l)*.3}}});break;

function shareOf(p){const c=G.clubs[p.club];return c&&c.gp?clamp(p.st.min/(c.gp*90),0,1):0}
function pEvent(p,t,d){ensureP(p);p.ev.push({s:G.season,w:G.wk,t,d});if(p.ev.length>20)p.ev.shift()}
clubName=function(id){return G.clubs[id]?G.clubs[id].ko:id==='FOR'?'해외(기타)':id==='RET'?'은퇴':id==='FA'?'자유계약(FA)':id};

// ---- 가치: 계약 잔여 기간 반영 ----
playerValue=function(p){let v=_pvBase(p);if(p.ct&&G&&G.cal){const yl=p.ct.end-G.season;v*=yl<=0?(G.wk>NW()*.5?.35:.6):yl===1?.85:yl===2?.95:1}if(p.req)v*=.9;return Math.max(.3,Math.round(v*10)/10)};
// ---- 폼(연속 호평/혹평) · 슬럼프가 경기력에 반영 ----
const _pmBase=playerMult;
playerMult=function(p,l,f){return _pmBase(p,l,f)*(1+.022*(p.hot||0))*(p.slump>0?.96:1)};

// ================= 메일 =================
const MAILCAT=['이적','계약','경기','스카우트','이사회','훈련','의료','선수','언론','리그'];
const MAILIC={이적:'💼',계약:'📝',경기:'⚽',스카우트:'🔭',이사회:'🏛️',훈련:'🏋️',의료:'🩺',선수:'👤',언론:'📰',리그:'🏆',시스템:'⚙️'};
function sendMail(o){if(!G)return;G.mail=G.mail||[];G._mid=(G._mid||0)+1;G.mail.unshift({id:'m'+G._mid,s:G.season,wk:G.wk,read:0,ic:MAILIC[o.cat]||'✉️',...o});
 if(G.mail.length>260){const keep=G.mail.filter((m,i)=>i<220||m.flag);G.mail=keep.slice(0,260)}}
function unread(){return G&&G.mail?G.mail.filter(m=>!m.read).length:0}
function mailDate(m){return `${m.s}-${String(m.s+1).slice(2)} · ${m.wk+1}주`}
const NEWS2MAIL={의료:['의료팀장','의료'],징계:['수석코치','경기'],유스:['유스 아카데미 디렉터','훈련'],선수:['언론','언론'],대항전:['UEFA','리그']};
const _addNewsBase=addNews;
addNews=function(t,tag){_addNewsBase(t,tag);try{const r=NEWS2MAIL[tag];if(r&&G)sendMail({cat:r[1],from:r[0],subj:t.replace(/<[^>]+>/g,'').slice(0,60),body:`<p>${t}</p>`})}catch(e){}};
