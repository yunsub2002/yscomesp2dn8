makeOffer=function(p,mult,unsolicited,forced){
 ensureP(p);if(p.loan||p.pre||p.club!==G.myId)return;if(p.nfs&&!p.req&&R()<.8)return;
 const me=my();const v=playerValue(p);const amt=Math.round(v*mult*10)/10;
 const buyers=Object.values(G.clubs).filter(c=>c.id!==G.myId&&c.budget>=amt*1.05&&c.players.length<35&&c.rep>=p.ovr-10&&p.ovr>=clubStr(c)-7);
 const from=forced||(buyers.length&&R()<.86?wpick(buyers,c=>Math.max(1,c.rep-60)*(c.lg?1:.4)).id:'F:'+pick(FOREIGN));
 if(G.offers.some(o=>o.pid===p.id&&o.from===from))return;
 const bud=from.startsWith('F:')?amt*1.7:club(from).budget;
 const max=Math.max(amt,Math.round(Math.min(bud*.92,amt*(1.08+R()*.37))*10)/10);
 G._oid=(G._oid||0)+1;
 const o={id:'o'+G._oid,pid:p.id,from,amt,max,r:G.wk,st:'open',rd:0,add:R()<.4?Math.round(amt*(.05+R()*.15)*10)/10:0,log:[`${fromName(from)} 최초 제안 ${money(amt)}`]};
 G.offers.push(o);
 _addNewsBase(`${fromName(from)}이(가) <b>${p.name}</b>에게 ${money(amt)} 이적 제안을 보냈습니다.${unsolicited?' (비공개 접근)':''}`,'이적');
 sendMail({cat:'이적',from:fromName(from)+' 단장',subj:`[이적 제안] ${p.name} — ${money(amt)}${o.add?` (+보너스 ${money(o.add)})`:''}`,k:'offer',ref:o.id,
  body:`<p>${fromName(from)}이(가) <b>${pName(p)}</b> 영입을 위해 공식 제안을 보내왔습니다.${unsolicited?' 판매 등록되지 않은 선수에 대한 <b>비공개 접근</b>입니다.':''}</p>`});
 if(!forced&&p.ovr>=81&&R()<.28){const others=buyers.filter(c=>c.id!==from&&c.rep>=me.rep-6);if(others.length){const c2=wpick(others,c=>c.rep-60);makeOffer(p,mult*(1.03+R()*.12),unsolicited,c2.id);
  sendMail({cat:'언론',from:'언론',subj:`${p.name} 영입 경쟁 — ${fromName(from)} vs ${c2.ko}`,body:`<p>복수 구단이 <b>${pName(p)}</b> 영입전에 뛰어들었습니다. 경쟁 입찰로 이적료가 오를 수 있습니다.</p>`})}}
};
function offerState(o){return o.st==='agreed'?'<span class="good">합의 — 확정 대기</span>':o.rd?`<span class="warn">협상 중 (${o.rd}차)</span>`:'신규'}
function offerBox(o){
 if(!o||!G.offers.includes(o))return '<div class="tip n">이 제안은 이미 처리되었거나 만료되었습니다.</div>';
 const p=P(o.pid);const me=my();const b=o.from.startsWith('F:')?null:club(o.from);const v=playerValue(p);
 const att=p.req?'<span class="good">선수가 이적을 원합니다 (이적 요청)</span>':b&&b.rep>me.rep+3?(p.hid.amb>=12?'<span class="warn">선수가 이 구단에 큰 관심을 보입니다 — 거절 시 불만 가능</span>':'선수가 관심을 보입니다'):b&&b.rep<me.rep-6?'선수는 잔류를 선호합니다':'선수의 의사는 중립적입니다';
 return `<div class="negbox"><div class="row wrap" style="gap:14px">${faceHtml(p,46)}<div><b>${pName(p)}</b> <span class="mut">${POSKO[p.pos]} · ${p.age}세 · OVR ${p.ovr}/${p.pot}</span><div class="mut" style="font-size:12px">계약 ${expTxt(p.ct.end)} · 주급 ${wageK(p.ct.wage)} · 시장가치 ${money(v)}${p.ct.rc?` · 바이아웃 ${money(p.ct.rc)}`:''}</div></div></div>
 <table class="stbl" style="margin:8px 0"><tr><td class="mut">제안 구단</td><td>${b?`${badge(b)} ${clubLink(b)} <span class="mut">명성 ${b.rep} · ${clubLgTxt(b)}</span>`:fromName(o.from)}</td></tr>
 <tr><td class="mut">제안 금액</td><td><b style="font-size:16px">${money(o.amt)}</b>${o.add?` <span class="mut">+ 조건부 보너스 ${money(o.add)}</span>`:''} <span class="mut">(가치 대비 ${Math.round(o.amt/v*100)}%)</span></td></tr>
 <tr><td class="mut">상태</td><td>${offerState(o)}</td></tr><tr><td class="mut">선수 의사</td><td>${att}</td></tr></table>
 <div class="mut" style="font-size:11.5px;margin-bottom:6px">${o.log.slice(-4).join(' → ')}</div>
 <div class="row wrap" style="gap:6px"><button class="sm pri" onclick="acceptOffer('${o.id}');reRender()">${o.st==='agreed'?'✔ 이적 확정':'수락'}</button>
 ${o.st!=='agreed'?`<span class="mut">역제안 £</span><input class="coIn" data-o="${o.id}" type="number" step="0.5" value="${Math.round(o.amt*1.2*2)/2}" style="width:90px"><span class="mut">m</span><button class="sm" onclick="counterOffer('${o.id}',this)">역제안</button>`:''}
 <button class="sm" onclick="rejectOffer('${o.id}');reRender()">거절</button><button class="sm ghost" onclick="toggleNfs('${p.id}');reRender()">${p.nfs?'이적 불가 해제':'🔒 이적 불가 선언'}</button></div></div>`;
}
function counterOffer(oid,btn){
 const o=G.offers.find(x=>x.id===oid);if(!o)return;const inp=btn.parentElement.querySelector('.coIn');const v=+inp.value;if(!(v>0))return;
 const p=P(o.pid);o.rd++;o.r=G.wk;
 if(v<=o.amt){o.amt=v;o.st='agreed';o.log.push(`역제안 ${money(v)} → 즉시 수락`)}
 else if(v<=o.max){o.amt=v;o.st='agreed';o.log.push(`역제안 ${money(v)} → 수락`);toast(`${fromName(o.from)}가 ${money(v)}에 동의했습니다. "이적 확정"을 누르면 완료됩니다.`)}
 else if(v<=o.max*1.15&&o.rd<=3){const nv=Math.round(Math.min(o.max,o.amt+(o.max-o.amt)*.6+ (v-o.max)*.2)*10)/10;o.log.push(`역제안 ${money(v)} → 상향 ${money(nv)}`);o.amt=nv;toast(`${fromName(o.from)} 수정 제안: ${money(nv)}`)}
 else if(R()<.45||o.rd>3){G.offers=G.offers.filter(x=>x!==o);o.log.push(`역제안 ${money(v)} → 협상 결렬`);toast(`${fromName(o.from)}가 협상에서 철수했습니다.`);
  sendMail({cat:'이적',from:fromName(o.from)+' 단장',subj:`${p.name} 영입 철회`,body:`<p>요구 금액(${money(v)})이 과도하다는 판단 하에 <b>${p.name}</b> 영입 협상을 중단합니다.</p>`})}
 else{o.log.push(`역제안 ${money(v)} → 거부 (기존 ${money(o.amt)} 유지)`);toast(`${fromName(o.from)}: 더 이상 올릴 수 없다는 입장입니다.`)}
 reRender();
}
acceptOffer=function(oid){
 const o=G.offers.find(x=>x.id===oid);if(!o)return toast('만료된 제안입니다.');
 if(!windowOpen())return toast('이적시장이 닫혀 있습니다. 다음 이적시장에서 처리할 수 있습니다.');
 const p=P(o.pid);const me=my();
 if(me.players.length<=16)return toast('스쿼드가 16명 이하라 판매할 수 없습니다.');
 if(p.pos==='GK'&&me.players.filter(id=>P(id).pos==='GK').length<=2)return toast('골키퍼는 최소 2명 필요합니다.');
 const b=o.from.startsWith('F:')?null:club(o.from);const br=b?b.rep:84;
 if(o.pw==null)o.pw=(p.req||p.listed||br>=me.rep-4||p.hid.loy<8||R()<.55)?1:0;
 if(!o.pw){G.offers=G.offers.filter(x=>x!==o);p.mor=clamp(p.mor+4,10,100);
  sendMail({cat:'이적',from:'수석코치',subj:`${p.name}, ${fromName(o.from)} 이적 거부`,body:`<p>구단 간 합의에도 불구하고 <b>${pName(p)}</b>이(가) ${fromName(o.from)}과의 개인 협상을 거부했습니다. 선수는 팀에 남기를 원합니다.</p>`});
  return toast(`${p.name}이(가) 개인 조건 협상을 거부했습니다.`)}
 sellPlayer(p,o.from,o.amt,o.add);
 G.offers=G.offers.filter(x=>x.pid!==p.id);
 toast(`${p.name} 판매 완료 (+${money(o.amt)})`);
};
function sellPlayer(p,to,fee,add){
 const me=my();me.players=me.players.filter(id=>id!==p.id);me.tac.xi=me.tac.xi.map(id=>id===p.id?null:id);
 let net=fee;if(p.sellOn&&G.clubs[p.sellOn.club]&&p.sellOn.club!==to){const s=Math.round(fee*p.sellOn.pct/100*10)/10;net-=s;club(p.sellOn.club).budget+=s}
 me.budget=Math.round((me.budget+net)*10)/10;p.listed=0;p.nfs=0;p.req=0;p.sellOn=null;p.prom=null;p.no=0;
 if(to.startsWith('F:')){p.club='FOR'}else{const b=club(to);b.players.push(p.id);b.budget=Math.round((b.budget-fee)*10)/10;p.club=b.id;
  p.ct={end:G.season+ri(3,5),wage:Math.round(wageFor(p,b.rep)*1.1*2)/2,rc:b.lg==='ESP'?Math.round(_pvBase(p)*3):0};if(add)G.addons.push({pid:p.id,payer:b.id,to:me.id,amt:add,s:G.season})}
 p.hist.push(`${G.season} ${me.ko}→${fromName(to)} ${money(fee)}`);pEvent(p,'이적',`${me.ko}→${fromName(to)} ${money(fee)}`);
 _addNewsBase(`<b>${p.name}</b>을(를) ${fromName(to)}에 ${money(fee)}에 판매했습니다.`,'이적');
 sendMail({cat:'이적',from:'재무 이사',subj:`이적 완료: ${p.name} → ${fromName(to)} (${money(fee)})`,body:`<p><b>${p.name}</b>의 ${fromName(to)} 이적이 완료되었습니다. 이적료 ${money(fee)}${net!==fee?` (셀온 조항 지급 후 실수령 ${money(net)})`:''}가 예산에 반영되었습니다.${add?` 조건부 보너스 ${money(add)}는 선수가 시즌 15경기 이상 출전 시 지급됩니다.`:''}</p><p class="mut">현재 이적 예산 ${money(me.budget)}</p>`});
 assignNumbers();
}
rejectOffer=function(oid){
 const o=G.offers.find(x=>x.id===oid);if(!o)return;G.offers=G.offers.filter(x=>x!==o);const p=P(o.pid);const me=my();
 const b=o.from.startsWith('F:')?null:club(o.from);const br=b?b.rep:84;
 if(br>me.rep+3&&p.hid.amb>=12&&o.amt>=playerValue(p)*.9&&!p.req){p.mor=clamp(p.mor-12,10,100);p.rejN=(p.rejN||0)+1;
  if(p.rejN>=2||(p.hid.amb>=16&&p.hid.loy<8)){p.req=1;p.listed=1;pEvent(p,'이적 요청','빅클럽 제안 거절');
   sendMail({cat:'선수',from:p.name,subj:`[이적 요청] ${p.name}이(가) 공식 이적 요청서를 제출했습니다`,k:'req',ref:p.id,body:`<p>감독님, ${fromName(o.from)}의 제안을 거절하신 결정에 실망했습니다. 제 커리어를 위해 <b>공식적으로 이적을 요청</b>합니다.</p><p class="mut">이적 요청 중에는 사기가 낮게 유지되고 재계약을 거부합니다. 면담으로 설득하거나 판매를 검토하세요.</p>`})}
  else sendMail({cat:'선수',from:'수석코치',subj:`${p.name}, 이적 제안 거절에 실망`,body:`<p><b>${pName(p)}</b>이(가) ${fromName(o.from)}의 제안이 거절된 데 대해 실망감을 드러냈습니다. 다시 한번 비슷한 제안을 거절하면 이적 요청으로 이어질 수 있습니다.</p>`})}
};
function toggleNfs(pid){const p=P(pid);p.nfs=p.nfs?0:1;if(p.nfs){p.listed=0;G.offers=G.offers.filter(o=>o.pid!==pid);toast(`${p.name} — 이적 불가 선언`);if(p.hid.amb>=14&&!p.req)p.mor=clamp(p.mor-4,10,100);else p.mor=clamp(p.mor+5,10,100)}else toast('이적 불가 해제')}
function reRender(){const box=document.querySelector('.modal[data-k]');const k=box&&box.dataset.k;render();if(k){const [t,a,b]=k.split('|');if(t==='offer'&&G.offers.find(o=>o.id===a))offerModal(a);else if(t==='neg')negModal(a,b);else if(t==='pl')playerModal(a)}}
function offerModal(oid){const o=G.offers.find(x=>x.id===oid);document.querySelectorAll('.modal[data-k]').forEach(x=>x.remove());const m=document.createElement('div');m.className='modal';m.dataset.k='offer|'+oid;m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class="box" style="max-width:620px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">💼 이적 제안 협상</h2><button class="sm" onclick="closeTopModal()">✕</button></div>${offerBox(o)}</div>`;document.body.appendChild(m)}
function offersMini(){const offers=G.offers.filter(o=>P(o.pid).club===G.myId);if(!offers.length)return '<p class="mut">아직 제안이 없습니다.</p>';
 return `<table>${offers.map(o=>{const p=P(o.pid);return `<tr><td>${posTag(p.pos)} <b>${p.name}</b></td><td>${fromName(o.from)}</td><td class="n">${money(o.amt)}${o.add?`<span class="mut" style="font-size:11px">+${money(o.add)}</span>`:''}</td><td style="font-size:12px">${offerState(o)}</td><td><button class="sm pri" onclick="offerModal('${o.id}')">협상</button> <button class="sm" onclick="rejectOffer('${o.id}');render()">거절</button></td></tr>`}).join('')}</table>`}

// ================= 이적: 내가 보내는 제안 (구단 협상 → 개인 조건) =================
function interestOf(p,buyer){
 const cur=G.clubs[p.club];const gap=(cur?cur.rep:66)-buyer.rep;const amb=p.hid.amb;
 let mult=1.1+Math.max(0,gap)*.035*(amb/10)-Math.max(0,-gap)*.008;
 const euro=G.eu&&COMP_IDS.some(cp=>G.eu[cp]&&G.eu[cp].teams.includes(buyer.id));if(!euro&&p.ovr>=80)mult+=.08;
 mult=clamp(mult,.95,1.9);
 const refuse=(gap>12&&p.ovr>=82&&hash(p.id+buyer.id+G.season)<.6)||(cur&&p.hid.loy>=17&&gap>4&&hash(p.id+'loy'+G.season)<.5);
 return {refuse,mult,txt:refuse?'<span class="bad">선수가 귀 구단 이적에 관심이 없습니다</span>':mult>1.45?'<span class="warn">관심은 있지만 높은 주급을 원합니다 (구단 명성 차이)</span>':mult>1.2?'관심을 보이지만 조건이 중요합니다':'<span class="good">이적에 긍정적입니다</span>'};
}
function demandOf(p,c,mode){
 const base=wageFor(p,c.rep);const cur=p.ct?p.ct.wage:base;let D;
 if(mode==='renew'){const ar=avgR(p)||6.7;D=Math.max(cur*1.05,base)*(ar>=7.3?1.15:ar>=7?1.07:ar<6.4?.95:1);if(p.mor<45)D*=1.12;if(p.age>=32)D=Math.min(D,Math.max(cur,base));D*=1+(p.hid.amb-10)*.01}
 else{const it=interestOf(p,c);D=Math.max(cur*1.12,base)*it.mult/1.1;if(mode==='free'||mode==='pre')D*=1.15}
 return {wage:Math.max(1,Math.round(D*2)/2),yrs:p.age<=23?5:p.age<=27?4:p.age<=30?3:p.age<=32?2:1,role:sqRankIn(p,c)};
}
function clubAsk(p){let a=askPrice(p);const s=club(p.club);if(p.listed)a*=.85;if(s.budget<10)a*=.92;if(s.lg&&s.lg===my().lg)a*=1.08;return Math.round(a*10)/10}
function negKey(mode,pid){return mode+':'+pid}
function newNeg(p,mode){
 const me=my();const n={pid:p.id,mode,club:p.club,s:G.season,stage:mode==='buy'?'club':'player',pat:3+Math.floor(hash(p.id+'pat'+G.wk)*2),ppat:3,log:[]};
 if(mode==='buy'){n.ask=clubAsk(p);const s=club(p.club);const top3=s.players.map(P).sort((a,b)=>b.ovr-a.ovr).slice(0,3).map(x=>x.id);n.untouch=top3.includes(p.id)&&s.rep>=me.rep&&!p.listed;}
 else n.dem=demandOf(p,me,mode),n.dem0=n.dem.wage;
 return n;
}
bidModal=function(pid,mode){

 if(p.loan)return toast('임대 중인 선수입니다.');
 if(!mode)mode=p.club==='FA'?'free':p.club===G.myId?'renew':'buy';
 negModal(pid,mode);
};
function negModal(pid,mode){
 const p=P(pid);const me=my();const key=negKey(mode,pid);let n=G.neg[key];
 if(n&&(n.s!==G.season||(n.club!==p.club&&n.stage!=='done')||(n.stage==='fail'&&G.wk>=n.until))){delete G.neg[key];n=null}
 if(!n){

  else if(p.age>=31&&R()<.028*(p.prof<.9?1.5:1)){devApply(p,-ri(2,3));ev=['📉 급격한 노쇠화','bad','신체 능력이 눈에 띄게 떨어졌습니다']}
  else if(!p.slump&&sh>.3&&ar<6.55&&R()<.05*(1+(10-p.hid.cons)/12)){p.slump=ri(3,6);p.mor=clamp(p.mor-8,10,100);ev=['🌧 슬럼프','bad','자신감을 잃고 부진에 빠졌습니다']}

const _endSeasonBase=endSeason;
endSeason=function(){
 ensureAll();const oldS=G.season;const me=my();
 // 조건부 보너스 정산
 G.addons.filter(a=>a.s===oldS).forEach(a=>{const p=P(a.pid);if(p&&p.st.app>=15&&G.clubs[a.payer]&&G.clubs[a.to]){club(a.payer).budget-=a.amt;club(a.to).budget+=a.amt;if(a.to===me.id||a.payer===me.id)sendMail({cat:'이적',from:'재무 이사',subj:`조건부 보너스 ${a.to===me.id?'수령':'지급'}: ${p.name} (${money(a.amt)})`,body:`<p>${p.name}의 출전 조건(15경기) 충족으로 ${money(a.amt)}이(가) ${a.to===me.id?'입금':'지급'}되었습니다.</p>`})}});
 G.addons=G.addons.filter(a=>a.s>oldS);
 // 임대 복귀 (시즌 기록은 임대 구단으로 남김)
 const loaned=Object.values(G.players).filter(p=>p.loan);
 loaned.forEach(p=>{const c=G.clubs[p.club];if(c){c.players=c.players.filter(id=>id!==p.id);c.tac.xi=c.tac.xi.map(id=>id===p.id?null:id)}const back=club(p.loan.from);if(!back.players.includes(p.id))back.players.push(p.id);p._lt=p.loan.to;p.club=p.loan.from;p.loan=null});
 const rec=_endSeasonBase();
 try{
  loaned.forEach(p=>{const r=(p.car||[]).find(x=>x.s===oldS);if(r)r.club=p._lt;delete p._lt});
  if(loaned.length)sendMail({cat:'이적',from:'단장',subj:`임대 선수 복귀 ${loaned.length}명`,body:`<p>${loaned.map(p=>`${pName(p)} (OVR ${p.ovr})`).join(', ')}이(가) 임대를 마치고 복귀했습니다.</p>`});
  Object.values(G.players).forEach(ensureP);
  const left=[],arrived=[];
  // 사전 계약 이행
  Object.values(G.players).forEach(p=>{if(!p.pre)return;if(p.club==='RET'){p.pre=null;return}const to=G.clubs[p.pre.to];if(!to){p.pre=null;return}
   const from=G.clubs[p.club];if(from){from.players=from.players.filter(id=>id!==p.id);from.tac.xi=from.tac.xi.map(id=>id===p.id?null:id)}
   if(!to.players.includes(p.id))to.players.push(p.id);p.hist.push(`${G.season} ${clubName(p.club)}→${to.ko} (자유 이적)`);if(from&&from.id===me.id)left.push(p);if(to.id===me.id)arrived.push(p);
   p.club=to.id;p.ct={...p.pre.ct};p.pre=null;p.listed=0;p.no=0;p.req=0});
  // 계약 만료
  const expired=[];
  Object.values(G.clubs).forEach(c=>{c.players.slice().forEach(id=>{const p=P(id);if(p.ct.end>=G.season)return;
   if(c.id===me.id){expired.push(p)}
   else{const keyP=isKey(p);const pr=p.age>=34?.25:p.age>=31?.55:keyP?.9:.62;if(R()<pr){p.ct.end=G.season+(p.age>=31?1:ri(2,4));p.ct.wage=Math.round(wageFor(p,c.rep)*(.9+R()*.3)*2)/2;return}}
   c.players=c.players.filter(x=>x!==id);c.tac.xi=c.tac.xi.map(x=>x===id?null:x);p.club='FA';p.faS=G.season;p.listed=0;p.no=0;p.hist.push(`${G.season} ${c.ko} 계약 만료 → FA`)})});
  if(expired.length||left.length||arrived.length)sendMail({cat:'계약',from:'단장',subj:`[이적 시장 개막] 계약 만료 ${expired.length}명 · 자유 이적 합류 ${arrived.length}명`,body:`${expired.length?`<h3>계약 만료로 떠난 선수</h3><p>${expired.map(p=>`${pName(p)} (${p.age}세)`).join(', ')}</p><p class="mut">자유계약(FA) 신분이라 다시 협상해 데려올 수도 있습니다.</p>`:''}${left.length?`<h3>사전 계약으로 떠난 선수</h3><p>${left.map(p=>`${pName(p)} → ${clubName(p.club)}`).join(', ')}</p>`:''}${arrived.length?`<h3>사전 계약으로 합류한 선수</h3><p>${arrived.map(p=>pName(p)).join(', ')}</p>`:''}`});
  // AI 스쿼드 보충 (FA → 유스)
  Object.values(G.clubs).forEach(c=>{if(c.id===me.id)return;let k=0;while(c.players.length<21&&k<8){k++;const fa=Object.values(G.players).filter(p=>p.club==='FA'&&p.ovr<=clubStr(c)+3&&p.ovr>=clubStr(c)-10).sort((a,b)=>b.ovr-a.ovr)[ri(0,3)];
    if(fa){c.players.push(fa.id);fa.club=c.id;fa.ct={end:G.season+ri(1,3),wage:wageFor(fa,c.rep),rc:0};fa.hist.push(`${G.season} FA→${c.ko}`);fa.faS=null}else{const id='p'+(G.pidSeq++);const pos=pick(POS_ORDER);G.players[id]={id,name:youthName(c.cc),pos,age:ri(17,19),ovr:ri(56,64),pot:ri(68,82),club:c.id,sta:ri(65,90),fit:100,mor:70,inj:0,ratings:[],st:blankPSt(),stc:{},susp:0,listed:0,hist:[],car:[],ah:[],tk:[],youth:1};genAttrs(G.players[id]);ensureP(G.players[id]);c.players.push(id)}}
   if(!validXI(c))styleSetup(c)});
  if(!validXI(me))autoXI(me);
  Object.values(G.players).forEach(p=>{p.rejN=0;p.wantNew=null;p.injW=0;if(p.slump)p.slump=0});
  me.wb=Math.round(Math.max(wageBill(me)*1.06,me.wb*(rec.myPos<=rec.exp?1.06:1.0))*10)/10;
  const d=rec.exp-rec.myPos;G.conf=Math.round(clamp(G.conf+(d>=3?15:d>=0?8:d>=-3?-8:-18),0,100));G.neg={};
  assignNumbers();seasonStartMails();
 }catch(e){console.error(e)}
 return rec;
};

// ================= AI 이적 (임대·사전계약 제외, FA 영입 포함) =================
aiTransfers=function(n){
 const clubsA=Object.values(G.clubs).filter(c=>c.id!==G.myId&&c.budget>8);
 const pool=Object.values(G.players).filter(p=>G.clubs[p.club]&&p.club!==G.myId&&p.inj<=0&&!p.loan&&!p.pre);
 for(let k=0;k<n;k++){
  const b=wpick(clubsA,c=>Math.pow(Math.max(1,c.rep-62),1.6)*Math.min(1,c.budget/40));if(!b)return;
  const sq=b.players.map(P);
  const need=POS_ORDER.map(pos=>{const ps=sq.filter(p=>p.pos===pos).sort((x,y)=>y.ovr-x.ovr);const want=pos==='CB'?2:pos==='CM'?2:1;const v=ps.length>=want?ps[want-1].ovr:50;return{pos,v}}).sort((x,y)=>x.v-y.v)[0];
  const cands=[];for(let t=0;t<260;t++){const p=pick(pool);if(p.pos!==need.pos||p.club===b.id||!G.clubs[p.club]||p.loan||p.pre)continue;const s=club(p.club);
   if(s.rep>b.rep+2||s.players.length<=19||p.ovr<need.v+2||p.ovr>clubStr(b)+6)continue;const price=askPrice(p);if(price>b.budget*.65)continue;
   if(p.pos==='GK'&&s.players.filter(id=>P(id).pos==='GK').length<=2)continue;cands.push({p,price})}
  const fa=Object.values(G.players).filter(p=>p.club==='FA'&&p.pos===need.pos&&p.ovr>=need.v+1&&p.ovr<=clubStr(b)+5).sort((x,y)=>y.ovr-x.ovr)[0];
  if(fa&&b.players.length<27&&(!cands.length||R()<.35)){b.players.push(fa.id);fa.club=b.id;fa.faS=null;ensureP(fa);fa.ct={end:G.season+ri(1,3),wage:wageFor(fa,b.rep),rc:0};fa.hist.push(`${G.season} FA→${b.ko}`);if(fa.ovr>=78||b.lg===myLg())_addNewsBase(`[자유계약] <b>${fa.name}</b>(${fa.ovr}) → ${b.ko}`,'이적');continue}
  if(!cands.length)continue;
  const best=cands.sort((x,y)=>(y.p.ovr+(y.p.pot-y.p.ovr)*.3-y.price*.05)-(x.p.ovr+(x.p.pot-x.p.ovr)*.3-x.price*.05))[0];
  const p=best.p,s=club(p.club),price=best.price;
  s.players=s.players.filter(id=>id!==p.id);s.tac.xi=s.tac.xi.map(id=>id===p.id?null:id);s.budget=Math.round((s.budget+price)*10)/10;
  b.players.push(p.id);b.budget=Math.round((b.budget-price)*10)/10;p.club=b.id;p.listed=0;p.no=0;
  ensureP(p);p.ct={end:G.season+ri(3,5),wage:Math.round(wageFor(p,b.rep)*1.08*2)/2,rc:b.lg==='ESP'?Math.round(_pvBase(p)*3):0};
  p.hist.push(`${G.season} ${s.ko}→${b.ko} ${money(price)}`);
  if(p.ovr>=80||b.lg===myLg()||s.lg===myLg())_addNewsBase(`[이적] <b>${p.name}</b>(${p.ovr}) ${s.ko} → ${b.ko}, ${money(price)}`,'이적');
  if(!validXI(s))autoXI(s);
  while(b.players.length>35){const w=b.players.map(P).filter(q=>q.pos!=='GK'&&!q.loan).sort((x,y)=>(x.ovr-(x.age>=31?3:0))-(y.ovr-(y.age>=31?3:0)))[0];if(!w)break;b.players=b.players.filter(id=>id!==w.id);b.tac.xi=b.tac.xi.map(id=>id===w.id?null:id);w.club='FOR';w.hist.push(`${G.season} ${b.ko}→해외 이적`)}
 }
 assignNumbers();
};

(function(){

  const nav=document.querySelector('.nav');const on=nav&&nav.querySelector('button.on');
  if(nav&&on&&mq.matches)nav.scrollLeft=Math.max(0,on.offsetLeft-nav.clientWidth/2+on.offsetWidth/2);
 }
 let pend=false,lastK='';
 const ob=new MutationObserver(()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;wrapTables();fixNav();const k=document.querySelector('.app')?'app':document.querySelector('.start')?'start':'';if(k!==lastK){if(lastK)window.scrollTo(0,0);lastK=k}})});
 function start(){wrapTables();fixNav();ob.observe(document.body,{childList:true,subtree:true})}
 if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
 // 탭을 바꾸면 맨 위로
 document.addEventListener('click',e=>{const b=e.target.closest('.nav button');if(b&&mq.matches&&!b.closest('.foot'))setTimeout(()=>window.scrollTo(0,0),0)},true);
})();
</script>

 [['h',m.h,h,a],['a',m.a,a,h]].forEach(([s,id,f,g])=>{const c=G.clubs[id];if(!c)return;c.wsk=f>g?(c.wsk||0)+1:0;c.usk=f>=g?(c.usk||0)+1:0;

}catch(e){}return r};
